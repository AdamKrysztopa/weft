[project]
name = "weft-clean"
version = "1.0.0"
description = "First-party text-cleaning pack. Publishes the Cleaner contract."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["weft-kernel>=0.1.0,<1.0.0", "ftfy>=6.2"]

# The one entry point a pack declares (`docs/02-extension-model.md` section 2).
[project.entry-points."weft.packs"]
clean = "weft_clean:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
