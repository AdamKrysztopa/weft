[project]
name = "weft-prompts"
version = "1.0.0"
description = "First-party prompt pack. Publishes the Prompt contract and the structured-output cascade."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["weft-kernel>=0.1.0,<1.0.0", "weft-llm>=1.0.0,<2.0.0"]

# No `[project.entry-points."weft.packs"]` block yet — see `packages/weft-retrieve/pyproject.toml`
# for the whole reason: fitness function 2 asserts that every distribution declaring this entry
# point is active *and contributing*, and task 2.10 publishes the contract and the machinery
# without owning a single prompt. Every first-party prompt belongs to the plugin that asks it a
# question — `cited-answer` (2.9), `llm-rerank` (2.7), `hyde` (2.16), `step-back` (2.17) — and
# lands with that task, which adds this line the same way a third-party prompt pack would.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
