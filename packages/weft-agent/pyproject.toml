[project]
name = "weft-agent"
version = "0.1.0"
description = "First-party agentic front end. A pack, built against nothing but the released API, on the same terms a stranger has — docs/05-grilling-sessions.md G8."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
# `weft-rag` is a real dependency, not a convenience: this pack registers against
# `weft_prompts.contract.Prompt`, a contract that distribution publishes — task 7.1's own
# structural test (`tests/architecture/test_ff21_agent_is_an_ordinary_pack.py`) asserts every
# contract this pack registers under is defined *outside* `weft_agent`.
dependencies = ["weft-kernel>=0.1.0,<1.0.0", "weft-rag>=2.0.0,<3.0.0"]

# The one entry point a pack declares (`docs/02-extension-model.md` section 2) — the same
# single mechanism a third party uses, per `01` -> Phase 7's own claim for this pack.
[project.entry-points."weft.packs"]
agent = "weft_agent:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
