[project]
name = "weft-embed"
version = "0.0.0"
description = "First-party embedding pack. Publishes the Embedder contract."
requires-python = ">=3.12"
dependencies = ["weft-kernel"]

# The one entry point a pack declares (`docs/02-extension-model.md` section 2).
[project.entry-points."weft.packs"]
embed = "weft_embed:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
