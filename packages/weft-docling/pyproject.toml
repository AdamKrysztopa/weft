[project]
name = "weft-docling"
version = "0.1.0"
description = "First-party learned-layout PDF pack. Registers one Extractor backend over the contract weft-extract publishes."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
# **A distribution of its own for the same reason `weft-pdf` is one, one order of magnitude
# louder.** `weft_pdf/__init__.py` argues that putting `pypdf` and `pdfplumber` beside the
# `Extractor` contract would make every install pay for a parser it may never call. Measured
# here on 2026-09-06, on Python 3.12: this pack's dependency set installs **897 MB** —
# `torch` 2.14, `torchvision` and `transformers` — against `weft-pdf`'s few megabytes. An
# operator who wants a born-digital parser must not pay that, and `pdf-text` and `pdf-layout`
# remain available with this distribution absent.
#
# **Licences.** `docling-slim`, `docling-core` and `docling-ibm-models` are MIT; `doclang` and
# `transformers` are Apache-2.0; `torch` is Apache-2.0 with permissive components; `torchvision`
# is BSD. None widens what an MIT library asks of the people who install it, and none is
# AGPL — `01`'s licence refusal record is why that sentence is written rather than assumed.
#
# **`convert-core` is in this extras list and is not in the ledger line that specified it.**
# `9.13` names `docling-slim[format-pdf,models-local]`; installed exactly so, on 3.12,
# `import docling.document_converter` raises `ModuleNotFoundError: No module named 'scipy'` —
# `document_converter` reaches `models/base_ocr_model.py` unconditionally through its pipeline
# imports. So the specified set installs and cannot be imported. `convert-core` is the extra
# that carries it. Measured before it was promised, which is what that line asked for.
# `format-html-render` (a browser) and `format-audio` (a speech model) stay out, per the ledger.
#
# **`feat-ocr-rapidocr-onnx` is the second extra the ledger line did not name, and running the
# binary is what found it.** With `convert-core` alone the pack imports, registers and reports
# `ACTIVE`, and then every real conversion fails twice over: `No OCR engine found` (the config's
# `ocr` default is `True` and no engine ships) and `No module named 'cv2'`. `rapidocr` carries
# both, on `onnxruntime` rather than more `torch`, which is the lightest engine of the five
# `feat-ocr-*` extras offer. An installable, importable distribution that cannot convert a
# document is the failure this line's own "measured before it is promised" clause is about, and
# it took two measurements rather than one to find the bottom of it.
dependencies = [
    "weft-kernel>=0.1.0,<1.0.0",
    "weft-rag>=2.2.0,<3.0.0",
    "docling-slim[convert-core,format-pdf,models-local,feat-ocr-rapidocr-onnx]>=2.126",
]

# The one entry point a pack declares (`docs/02-extension-model.md` section 2).
[project.entry-points."weft.packs"]
docling = "weft_docling:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.weft]
# **G19, 2026-09-09: this distribution is never published.** The owner settled that Weft ships
# under exactly two names, `weft-kernel` and `weft-rag`, and that a new capability never adds a
# third. This pack's code moves inside the `weft-rag` wheel and its outside library becomes an
# extra, so the dependency stays declinable while the code costs kilobytes. The marker goes on
# first, before the code moves, so `release.yml` can never create a name G19 forbids — the six
# names this repository was one tagged release away from claiming. `CLAUDE.md` carries the rule
# and `05` -> G19 the reasoning.
publish = false
