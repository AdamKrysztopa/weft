[project]
name = "weft-openai"
version = "0.1.0"
description = "First-party OpenAI adapter pack. Registers under contracts other packs publish."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
# `openai` is Apache-2.0, so it widens nothing an MIT library asks of the people who
# install it. The floor is the version this pack's behaviour was measured against; a
# claim about an older release would be a claim nobody here has checked.
# `weft-rag` replaces the `weft-embed` and `weft-llm` pins this used to carry: both modules —
# whose `Embedder` and `LLMProvider` contracts this pack registers against — now ship inside
# that one wheel. The imports are unchanged; only the name that delivers them is.
# `pillow` is not optional and is not a vision *extra*: `weft_openai/vision.py:33` imports
# `PIL.Image` at module scope, and `weft_openai:register` imports that module, so a missing
# Pillow does not degrade the Describer — it fails the whole pack and registers **none** of
# its three plugins. Added 2026-09-08 (`docs/lessons.md` `L10.41`) after a clean out-of-repo
# install reported `openai (weft-openai) 0.1.0: failed (0 contributed) / reason: No module
# named 'PIL'` while every test in this tree stayed green, because the development venv holds
# Pillow as somebody else's transitive dependency. A dependency list is a claim about a clean
# install and only a clean install can falsify it.
dependencies = [
    "weft-kernel>=0.1.0,<1.0.0",
    "weft-rag>=2.2.0,<3.0.0",
    "openai>=3.1",
    "pillow>=10.0",
]

# The one entry point a pack declares (`docs/02-extension-model.md` section 2).
[project.entry-points."weft.packs"]
openai = "weft_openai:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
