name: index-text
# **No `route.summary`, on purpose.** An ingest document is never a routing target: it produces
# nodes, not an `Answer`, and `nearest-description` selects among things `weft ask` can run.
# `weft_retrieve.engine.PipelineRouteCatalogue` reads `route.summary` and nothing else, so
# omitting it is what keeps this document out of the router's candidate set — not a comment
# asking anyone to remember.

# **The first ingest document this project has ever shipped**, and the root the other four
# derive from. Until it existed, `weft index`'s four stages were Python constants in
# `weft_cli.ingest` and `--pipeline` was a flag with nothing to point at: every cleaner, the
# chunker, the embedder and the store were registered, reachable by `weft plugins list`, and
# placeable by nobody.
#
# **What `--pipeline` costs you, stated here because it is easy to be surprised by.** A named
# document's stages name their own plugins, so `[services] embed` and `[services] store` in
# `weft.toml` are **not read** for this run (`weft_cli.ingest.run_index`, "Q3, settled"). That is
# the right rule — a document that says `hash` must not silently become `openai` because a
# config file elsewhere said so — but it means an operator who has configured a real embedder
# has to derive from this document and `set:` the embed stage, rather than expecting their
# `weft.toml` to apply. `weft pipeline derive index-text my-index` scaffolds the child, and a
# `replace:` block naming `openai-embeddings` at the `embed` id is that edit. **This line used
# to name a `--set` flag `weft pipeline derive` has never had, for a plugin name no document
# could resolve** — both found by running the binary, neither by any test (`docs/internal/lessons.md`
# L8.14; ledger 8.15 split the name).
#
# Two cleaners only, and both are safe on any text in any language: `unicode-normalize` folds
# the several ways a character can be spelled into one, `whitespace` collapses runs and trims.
# The other four cleaners repair damage that specific *sources* cause rather than damage text
# has in general, so they sit on `index-messy-text` and `index-polish` instead of here — a
# cleaner that fires on a corpus it was not meant for is silent corruption, not a no-op.
stages:
  - {id: extract,    use: text}
  - {id: normalize,  use: unicode-normalize}
  - {id: whitespace, use: whitespace}
  - {id: chunk,      use: fixed-size, with: {size: 512, overlap: 50}}
  - {id: embed,      use: hash}
  - {id: store,      use: pgvector}

# **The first `slots:` block any shipped document has carried** — carried repair `R9.10`.
# `Pipeline.slots` was placed, id-qualified and recorded by resolution for two whole phases
# with no document declaring one, so the consuming half had only ever run against producers
# written to exercise it (`docs/internal/lessons.md` L9.12, and L5.15's shape: an extension point with
# a producing side and no consuming side).
#
# **Why this document and not a new one.** Only the root of an `extends` chain may carry
# `slots:` (`weft_kernel.resolution._apply_ancestry_operators`), and this is the ingest root
# — eight documents derive from it directly and more below them — so declaring it here is the
# only edit that offers the slot to every ingest rung. A new root written to hold a slot would
# demonstrate the machinery against a document nobody uses, which is the same
# derived-from-what-it-verifies shape the repair exists to end.
#
# **Why after `chunk`.** `index-with-keywords` already made this choice by hand and stated it:
# keybert is placed "after `chunk` and before `embed`, because keywords are extracted per
# chunk, and because the vector is computed from content this stage does not touch". An
# enrichment slot anywhere else would contradict the one shipped document that already
# enriches.
#
# **Declaring a slot is an opt-in, not an invitation** — `02` §3 → *Slots*: installing a pack,
# possibly as a transitive dependency, must never silently change what a pipeline does, so
# this line is the deliberate statement that an `Enhancer` a pack offers may land here. It
# adds nothing when nothing contributes, and a derived document refuses contributions
# wholesale with `remove: enrich`, naming no pack.
slots:
  - {id: enrich, after: chunk}
