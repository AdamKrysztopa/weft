name: draft-then-refine
extends: retrieve-then-generate

# The other generator rung, and the cheap one. `refine-on-uncertainty` drafts an answer, reads a
# `Sufficiency` signal off it, and searches once more only if the draft came back hedging.
#
# `signal: hedge-phrases` is written out and is **not** the plugin's default (`llm-sufficiency`
# is), and the choice is the reason this rung exists beside `iterative-retrieve` rather than
# duplicating it. `hedge-phrases` is a locale-keyed phrase table — no model call, no network,
# a decision in microseconds — and `10` §1.5 calls it exactly what it is: the documented weak
# baseline. It fires on *hedging*, never on *unsupportedness*, which is the limit `10` §1.1
# records against the reference's own version of this mechanism. Naming it here makes the weak
# signal a visible, swappable choice: change this one line to `llm-sufficiency` and the
# judgement becomes a model call instead, with no other edit to this document.
vars:
  route.summary: >-
    Searches once, drafts an answer, and searches again only if the draft hedges — judged by a
    phrase table rather than by a model, so the check itself costs nothing. A cheaper
    approximation of iterative-retrieve that catches an uncertain answer but not a confidently
    wrong one.
  route.cost: >-
    one embedding call, one search and one model call to draft, then on a hedging draft one
    more search and one more model call — no model call for the judgement itself

replace:
  - id: generate
    use: refine-on-uncertainty
    with:
      signal: hedge-phrases
      retriever: vector-top-k
      max_rounds: 1
