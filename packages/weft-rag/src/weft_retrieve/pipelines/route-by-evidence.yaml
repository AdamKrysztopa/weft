name: route-by-evidence
# No `route.summary`: a router is never a routing target.

# The router whose every rule must cite the evidence claim that justifies it (`evidence-policy`,
# `eval/claims/`, `weft eval claims check`). One rule ships: reading the whole corpus, for a corpus
# in the size range it was measured in — about 250,000 tokens, which fits the generate role's
# context. It is taken only when the operator has set a prompt-token budget that holds the corpus,
# because it costs about 170 times the prompt tokens of one search in `whole-corpus-en`
# (`manual/evidence.md` §3). The
# shipped budget is 0, so a router that has not been given one answers through the fallback,
# `retrieve-then-generate`, exactly as `route-fixed` does; `query-profile` calls no model.
#
# If whole-corpus reading refuses at run time because the corpus counted past its token bound, the
# ask falls back to `retrieve-then-generate` and the route says so (task 44.23).
#
# Give it a budget by deriving it, never by editing it in place — a project document of its own:
#   name: route-with-budget
#   extends: route-by-evidence
#   set:
#     - {id: decide, with: {constraints: {max_prompt_tokens: 300000}}}
#
# Each rule's `when` must contain every predicate of every claim it cites, equal or tighter, and a
# rule that is a `defaults` entry needs claims from two populations (`tests/architecture`, FF40).
stages:
  - {id: score,  use: query-profile}
  - id: decide
    use: evidence-policy
    with:
      fallback: retrieve-then-generate
      constraints: {max_prompt_tokens: 0}
      defaults:
        - name: whole-corpus-when-it-fits
          when:
            - {feature: corpus.base_complete, op: eq, value: true}
            - {feature: corpus.fits_context, op: eq, value: true}
            - {feature: corpus.leaf_tokens, op: gte, value: 200000}
            - {feature: corpus.leaf_tokens, op: lte, value: 260000}
          then: whole-corpus-wide-then-generate
          prompt_tokens: corpus
          cites:
            - whole-corpus.fetch-operator.answer-correctness
            - whole-corpus.global.answer-correctness
