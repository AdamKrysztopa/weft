name: index-qdrant
extends: index-text

# **The store swapped, and nothing else** — `index-openai`'s shape one stage over, where that
# document swaps the embedder. One operator block is the whole diff, which is `02` §3's derivation
# model doing its job: the day `index-text`'s chunk size changes, this rung changes with it.
#
# **Why this document exists now, and it is a finding rather than a plan.** `qdrant` had no shipped
# document naming it until 2026-09-09. It could not have had one: fitness function 16 scopes itself
# to distributions that ship pipeline documents, `weft-qdrant` shipped none, and so the plugin sat
# outside the check entirely — registered, listed by `weft plugins list`, and placeable by nobody
# without writing YAML against a name they had no way to discover. **G19 folded that pack into this
# wheel and the check saw it for the first time**, which is the check earning its keep on a change
# it was not written for.
#
# `[packs.qdrant]` is where the URL and collection go, and the pack reports `failed` at discovery
# if `weft-rag[qdrant]` is not installed — so an operator who has not asked for the extra gets a
# named refusal from `weft plugins doctor` rather than a stage that cannot build.
replace:
  - id: store
    use: qdrant
