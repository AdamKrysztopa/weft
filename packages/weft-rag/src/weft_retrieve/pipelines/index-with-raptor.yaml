name: index-with-raptor
extends: index-text

# **The floor `raptor-and-leaves-rrf` has been standing on since it shipped.** That document
# searches two bases at once — the leaf chunks and the RAPTOR summaries built over them — by
# filtering on `ext.weft-index.technique == raptor`, and until this rung existed no shipped path
# produced a single node carrying that marker. The query rung was correct, the plugin was
# correct, and the pair could not be run by anybody who had not written this file themselves.
#
# `raptor` clusters the chunks by similarity and writes one summary per cluster, built through
# `Node.combine` so each summary's `Lineage.sources` is the union of its members' — which is
# what makes a summary reachable by cascade delete. `04` category A records the failure this
# guards against directly: a summary shipped with no `ref_doc_id` at all stays retrievable
# forever after its source document is deleted, describing content that is gone.
#
# **After `embed`, and that is the paper's own order rather than this document's preference.**
# Changed 2026-09-07 at ledger task 10.4; this paragraph used to say *before* `embed`, "for the same
# reason as `index-with-questions`". RAPTOR §3 (p.3): "The chunks and their corresponding SBERT
# embeddings form the leaf nodes of our tree structure", then clustering runs over those embeddings
# and "[o]nce clustered, a Language Model is used to summarize the grouped texts. These summarized
# texts are then re-embedded". So embedding is a *precondition* of clustering, and the summariser
# re-embeds its own output. Weft shipped the inverse, and the cost was real: `raptor` embedded the
# whole payload itself in order to cluster it, returned the leaves unembedded, and the `embed` stage
# below embedded every one of them **a second time** — neither shipped `Embedder` skips a node that
# already carries a vector, so on a paid account that was a doubled leaf bill on every ingest,
# disclosed nowhere including here.
#
# **`index-with-questions` keeps its own rule and this rung no longer shares it.** That document's
# *before* is load-bearing for a different reason — `hypothetical-questions` derives text nodes and
# nothing in it embeds, so a question inserted after `embed` would be stored unsearchable. `raptor`
# is now the one `Expander` that embeds what it creates, so it is the one that may sit here. Two
# enrichment rungs before `embed`, one after, each for a reason it states.
#
# **`raptor` refuses a node with no vector, by name.** It clusters by the vectors it is handed and
# computes none, so a derived document that puts this stage back before `embed` gets a `Failed`
# naming the stage that has to move — not a silent run that clusters nothing.
#
# **One level of summary, and it is the plugin's limit rather than this document's choice.**
# Corrected 2026-09-07 at ledger task 10.1. This paragraph used to say a second level "is a second
# stage naming it again, which is a document edit and not a plugin change", and told an operator to
# make one. It is not true and the plugin says so in bold: `weft_index.raptor`'s module docstring,
# *"Chaining `embed`, `raptor`, `embed`, `raptor`, ... does not yet build a correct deeper tree"* —
# the linear runner threads the whole cumulative node set into the next stage, nothing filters on
# `Lineage` or on the marker this plugin attaches, so a second `raptor` stage would cluster a leaf
# together with the summary already built from it and produce a node mixing raw and abstracted
# content. **The plugin was right and this document was wrong**, which is why the document changed:
# a pipeline document is the surface an operator acts on, so a rung that advertises a derivation
# nobody can safely take is worse than one that admits its ceiling. Sarthi et al. build a tree of
# several levels; this rung builds the first. Ledger task **10.7** is where depth becomes real, and
# it is demonstrated there by a new derived document rather than by restoring this sentence.
#
# **One tree, over the collection this run writes to — not one tree per document.** `raptor`
# clusters whatever this invocation handed it and reads no store, so *the collection is expected to
# be indexed in one run*. Index ten documents in one `weft index` and they share one tree; index
# them in two commands and the second founds a second tree rather than joining the first. That is a
# deliberate divergence from Sarthi et al., whose p.9 builds one tree per story, and it is stated
# here rather than left to be discovered from a second ingest.
#
# **With the default `hash` embedder this rung now refuses loudly, and that is the improvement
# ledger task 10.9 is for.** `cluster_size` and `similarity_threshold` used to be typed here at
# `4` and `0.75` — numbers nobody measured, the same posture every paper in `10` §1.2 takes with
# its own thresholds. Neither is set below any more, so `auto` resolves both, once per run, from
# this run's own payload: `similarity_threshold` as the 75th percentile of the pairwise cosine
# similarities the payload actually exhibits, refused when the *median* observed pair is at or
# below zero, because a threshold has nothing to describe where the typical pair is orthogonal or
# worse. Measured 2026-09-07 on 107 real chunks embedded both ways: `hash` gives a median of
# **−0.0028** and `openai-embeddings` gives **0.4328** — this is `hash`'s own vectors stating, in
# a number, what they already admitted in words. So under the default embedder `auto` now
# **fails the run**, naming the embedder and the word `auto`, rather than the old outcome, which
# was `Produced` over zero summaries: the leaves stored, the run reporting success, and this
# rung's entire purpose — the summaries `raptor-and-leaves-rrf` searches for — silently absent. A
# `Failed` from this stage ends the batch (`weft_kernel.runner`), so `weft index` under this
# document now stores nothing and exits non-zero rather than storing half a corpus and calling it
# done. Configure a real embedder in `[services] embed`, or type `similarity_threshold` yourself
# in a derived document if you are only exercising the shape and want `hash` to keep working.
#
# **Cost is per cluster and is not bounded by this document.** `max_concurrent_summaries: 8` is
# the plugin's own default and is kept; ledger task 8.7 is the wider cap that is not there yet.
insert:
  - after: embed
    stage:
      id: summarise
      use: raptor
      with: {min_cluster_size: 2}
