[project]
name = "weft-chunk"
version = "0.0.0"
description = "First-party chunking pack. Publishes the Chunker contract."
requires-python = ">=3.12"
dependencies = ["weft-kernel"]

# The one entry point a pack declares (`docs/02-extension-model.md` section 2).
[project.entry-points."weft.packs"]
chunk = "weft_chunk:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
