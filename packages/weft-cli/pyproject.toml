[project]
name = "weft-cli"
version = "0.1.0"
description = "The Weft command line: the only driving adapter, and the only asyncio.run."
requires-python = ">=3.12"
dependencies = ["weft-kernel>=0.1.0,<1.0.0", "weft-command>=2.0.0,<3.0.0", "weft-extract>=1.0.0,<2.0.0", "weft-chunk>=1.0.0,<2.0.0", "weft-embed>=1.0.0,<2.0.0", "weft-store>=2.0.0,<3.0.0", "weft-llm>=1.0.0,<2.0.0", "weft-prompts>=1.0.0,<2.0.0", "weft-retrieve>=1.0.0,<2.0.0", "weft-generate>=1.0.0,<2.0.0", "weft-eval>=1.0.0,<2.0.0", "pyyaml", "opentelemetry-api", "packaging>=24"]

# The CLI is the one place `weft index`/`weft ask` are wired to a fixed, hardcoded
# built-in pipeline (`06` step 9) — Phase 1 replaces this with pipelines as data.
# `pyyaml` is here, and nowhere else in the tree, because `weft_cli.pipeline_catalogue`
# is the one module that opens a pipeline document — G1 fixes weft-kernel's dependencies
# at `pydantic` and `opentelemetry-api`, so a YAML parser can never live there.
# `weft-generate` is here because `weft_cli.route_ask` (task 2.8's `weft route` command)
# reads `weft_generate.payload.Answer` — added on repair, not at 2.8's own commit: nothing
# else weft-cli declares pulls it in (`weft-retrieve` deliberately does not import
# weft_generate, per `.phase2-design.md`'s DAG rule), so the shared workspace venv hid its
# absence until a reviewer built weft-cli's wheel alone and installed it clean.
# `weft-command` is here from task 3.1, for `weft_command.permission.PermissionClass` — see
# that module's docstring for why `PermissionClass` lives alongside the `Command` contract it
# names a mandatory declaration for, rather than in `weft-cli` itself.
# `weft-eval` is here from task 4.6, for `weft_eval.run_record` — `weft_cli.eval_commands`
# is what calls `build_run_record`/`write_run_record`/`load_run_record` from a real `weft eval
# run|compare`/`weft trace` invocation; see that module's own docstring.
# `opentelemetry-api` is here from task 5.1d, explicit rather than left to arrive
# transitively through `weft-kernel`: `weft_cli.tracing_status` reads
# `opentelemetry.trace.get_tracer_provider()` directly, to answer `weft plugins doctor`'s
# "are my spans going anywhere?" as a fact about the process rather than about any one named
# pack — see that module's own docstring.
# `packaging` is here from task 5.2e, explicit for the identical reason `opentelemetry-api`
# is: `weft_cli.skew` parses PEP 508 requirement strings and version specifiers to detect
# version skew for `weft plugins doctor`, and it must not depend on some other installed
# distribution happening to pull `packaging` in transitively.
[project.scripts]
weft = "weft_cli.cli:main"

# Task 3.2: `weft-cli` registers its own five built-in commands through the identical
# `weft.packs` entry point a third-party pack uses — CLAUDE.md's "built-ins get no shortcut",
# applied to the CLI's own surface. See `weft_cli.commands`'s own module docstring for why
# `weft-cli` is the owner rather than an eleventh distribution, and `weft_cli.cli`'s for how
# `weft --version` still runs none of this (fitness function 8(b)).
[project.entry-points."weft.packs"]
weft-cli = "weft_cli.commands:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
