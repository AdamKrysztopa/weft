name: Release

# The release job. Ledger task **6.2**; `docs/09-release.md` §1 (settled by G10, 2026-08-22).
#
# **Why the distribution list is written out by hand.** It is the point. Fitness function 10(a)
# compares "the distributions the release job actually passes to the index" against the workspace
# members that do not opt out — two sets from two files that can genuinely disagree. A workflow
# that derived its own matrix from `packages/*` would compare a function to itself and could never
# fail, which is the reference's `test_keys_parity` shape (`reference/study/08-salvage.md:777-782`) and the
# exact thing `01` writes the clause to avoid. So: add a distribution, add it here, or the gate
# says so. `tests/architecture/test_ff10_ship_set_integrity.py` is what says so.
#
# **Why `weft-canary` is absent.** Its entire purpose is to be *refused* by discovery (fitness
# function 8). It declares `[tool.weft] publish = false` in its own `pyproject.toml` and must never
# reach an index — `01` → *Fitness functions* 10(a) names it as the standing test case, and the
# check asserts both halves of that.
#
# **Why the default install is a second job rather than another matrix row.** It began as the
# release set, pinning exact versions (`==`, not a range — `09` §1), so it was uninstallable until
# everything it pinned was on the index; `needs: publish` made that ordering a fact rather than a
# hope about matrix scheduling. It pins nothing now except `weft-kernel`, so the ordering
# requirement is one edge rather than fifteen — but it is still a real edge, and the four add-ons
# in the first job depend on `weft-rag`, so the second job would be *first* if this were reordered
# by dependency. It stays a second job for one further reason: the check reads the `distribution`
# matrix of *every* job, so a third job cannot quietly publish something outside the comparison.
#
# **Six names, and fourteen left this list on 2026-09-05.** `weft-command`, `weft-extract`,
# `weft-chunk`, `weft-clean`, `weft-embed`, `weft-enhance`, `weft-index`, `weft-store`,
# `weft-retrieve`, `weft-generate`, `weft-llm`, `weft-prompts`, `weft-eval` and `weft-cli` ship
# inside `weft-rag` and are no longer published from this repository. Four of them
# (`weft-command`, `weft-embed`, `weft-generate`, `weft-llm`) reached PyPI at `0.1.0` before the
# rate limit stopped the rest and cannot be deleted; they are vestigial and receive no further
# versions. `packages/weft-rag/pyproject.toml` carries the argument in full.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the previous release run failed inside the cooling window"
        type: boolean
        default: false

jobs:
  # **The cooling-off gate — `docs/lessons.md` L7.9, and it is here because remembering did not
  # work.** PyPI rate-limits *project creation* and counts **attempts** over a rolling window
  # rather than successes, so a rerun while the window is hot re-saturates it and moves recovery
  # further away (L7.3). That rule was written down twice — in `lessons.md` and in a task brief —
  # and was still walked into on 2026-09-05, because what got checked before tagging was the
  # *size* of the next burst rather than the *time since the last one*. Those are different
  # variables, and only one of them is what the limiter counts.
  #
  # So the rule is enforced where the action is taken. This job refuses the whole workflow when
  # the previous Release run failed less than `COOLING_HOURS` ago, and says what to do instead.
  # It costs one API call and it can be overridden — `workflow_dispatch` with `force: true` —
  # because a legitimate reason to publish inside the window exists the moment PyPI grants a
  # rate-limit exception, and a guard with no override is a guard people delete.
  #
  # Measured, so the number is not a guess: the saturating burst was `08:53Z` and a single
  # request at `13:04Z` — four hours and eleven minutes later — was still refused on its first
  # attempt. Twelve hours is therefore the floor, not the estimate.
  cooling-off:
    name: PyPI's window has been left alone
    runs-on: ubuntu-latest
    env:
      COOLING_HOURS: "12"
    steps:
      - name: Refuse if the previous release run failed recently
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCED:-false}" = "true" ]; then
            echo "force: true — the cooling-off gate is being overridden deliberately."
            exit 0
          fi
          last_failure=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --status failure \
            --limit 1 \
            --json createdAt \
            --jq '.[0].createdAt // empty')
          if [ -z "$last_failure" ]; then
            echo "No previous failed Release run. Nothing to wait for."
            exit 0
          fi
          elapsed=$(( ( $(date -u +%s) - $(date -u -d "$last_failure" +%s) ) / 3600 ))
          echo "Previous failed Release run: $last_failure (${elapsed}h ago)."
          if [ "$elapsed" -lt "$COOLING_HOURS" ]; then
            echo "::error::Refusing to publish. The previous Release run failed ${elapsed}h ago and PyPI's project-creation limiter counts attempts over a rolling window, so publishing now is more likely to extend the block than to clear it — docs/lessons.md L7.3 and L7.9. Wait until ${COOLING_HOURS}h have passed, or ask PyPI support for a project-creation exception, then re-run. To override deliberately: workflow_dispatch with force=true."
            exit 1
          fi
          echo "Window has been left alone for ${elapsed}h. Proceeding."

  # The five distributions that version on their own beside the default install — `09` §1's
  # "independent semver per distribution", narrowed to the names that still have one. `weft-kernel`
  # is here because fitness function 1 installs it alone and imports it, which is what proves the
  # kernel names no capability; `weft-qdrant`, `weft-openai`, `weft-pdf` and `weft-otel` are here
  # because each carries a dependency somebody may decline, and they install *beside* `weft-rag`
  # exactly as a third-party pack does — requirement 4 holding at the packaging layer.
  publish:
    name: publish ${{ matrix.distribution }}
    needs: cooling-off
    runs-on: ubuntu-latest
    # An account-scoped API token in `PYPI_API_TOKEN`, not trusted publishing. The workflow was
    # written for the latter and this is a step down from it: a long-lived credential now exists,
    # and it is account-scoped because a project-scoped one cannot be minted for a project that has
    # never been published to. It was taken deliberately at v0.1.0, to claim twenty unclaimed names
    # without twenty manual `pending publisher` forms.
    #
    # **This is a debt, not a resting state.** Once v0.1.0 lands the projects exist, so the token
    # can be replaced by per-project trusted publishers and deleted. Until then `SECURITY.md` must
    # not be read as claiming no publishing credential exists — it makes no claim either way, and
    # that silence is now load-bearing rather than accurate by construction.
    strategy:
      fail-fast: false
      # **One at a time, and the first release is why.** A matrix of nineteen parallel jobs
      # asks PyPI to create nineteen *new projects* within seconds of each other, and PyPI
      # rate-limits project creation: `429 Too many new projects created`. Four landed and
      # fifteen were refused on the v0.1.0 attempt.
      #
      # The limiter counts *attempts* over a rolling window, not successes — so re-running the
      # failed jobs re-saturates it and makes recovery further away rather than nearer. Seven
      # attempts fired roughly a hundred creation requests and moved the count from four to
      # four. Serialising costs wall-clock on a job that runs once per release and removes the
      # burst entirely.
      #
      # This only bites on a **first** publish. Every later release uploads a version to a
      # project that already exists, which is not rate-limited the same way — which is exactly
      # why the burst was invisible until the one run where it mattered.
      max-parallel: 1
      matrix:
        distribution:
          - weft-kernel
          - weft-qdrant
          - weft-openai
          - weft-pdf
          - weft-otel
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Build ${{ matrix.distribution }}
        run: uv build --package ${{ matrix.distribution }} --out-dir dist

      # `--check-url` asks the index what is already there and skips those files, which is what
      # makes this workflow **re-runnable at all**. Without it, `v0.1.0`'s aftermath was
      # unrecoverable by rerun: four distributions had published, so a full re-run failed on
      # `File already exists` for exactly the four that had *succeeded*, and only the
      # rerun-failed-jobs path worked. A release job that cannot be re-run after a partial
      # failure turns every partial failure into hand-work.
      - name: Publish ${{ matrix.distribution }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  # The default install, last. `09` §1 settled on "a code-free distribution `weft` pinning one
  # exactly-tested combination"; since 2026-09-05 it *contains* that combination instead of
  # pinning it, and it is still what a newcomer installs.
  publish-release-set:
    name: publish the default install
    needs: publish
    runs-on: ubuntu-latest
    # Same token, same debt — see the `publish` job.
    strategy:
      matrix:
        distribution: [weft-rag]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Build ${{ matrix.distribution }}
        run: uv build --package ${{ matrix.distribution }} --out-dir dist

      # Idempotent for the same reason as the job above — see its own comment.
      - name: Publish ${{ matrix.distribution }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  # Ledger task 6.35. `09` section 5.2 says "the baseline run is published with the release", and
  # task 6.13 found that nothing published it: `eval/baselines/`, `eval/questions/` and
  # `corpus/manifest.toml` are what a stranger needs to reproduce the number, the shipped CLI can
  # already do the work (`weft eval run`, `weft eval compare`), and all three lived only in a git
  # checkout. Attached to the release rather than shipped inside a distribution — putting one
  # corpus's judgements into `weft-rag` would hand them to everybody installing the metric
  # contracts, and fetching the *pins* by a script the pins configure is circular.
  #
  # `needs: publish-release-set` so the artefacts land only once the wheels they describe are on
  # the index; a release carrying a baseline for distributions that failed to publish would be
  # worse than one carrying none.
  publish-reproduction-artefacts:
    name: attach what reproduces the baseline
    needs: publish-release-set
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect the artefacts a reproduction needs
        run: |
          mkdir -p reproduction
          cp -R eval/baselines reproduction/baselines
          cp -R eval/questions reproduction/questions
          cp corpus/manifest.toml reproduction/corpus-manifest.toml
          tar -czf weft-reproduction-${{ github.ref_name }}.tar.gz -C reproduction .

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" weft-reproduction-${{ github.ref_name }}.tar.gz
