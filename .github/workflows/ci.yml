name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The canonical gate, invoked as one task rather than as a list of steps.
  #
  # This is deliberate, and fitness function 0 depends on it: the checks that run
  # in CI must be exactly the checks `poe ci-checks` runs locally. A workflow that
  # enumerates its own steps can drift from the composite, which is how the reference
  # ended up with an architecture checker that was in the repository and in nobody's
  # gate.
  gate:
    name: ci-checks
    runs-on: ubuntu-latest
    # Same image, credentials, port and health check as `compose.yaml` — the container a
    # developer brings up by hand and the one this job provisions are the same container,
    # not two descriptions of it that could drift apart. This is provisioning the
    # environment `ci-checks` runs in, not enumerating the gate's steps: the gate step
    # below is still the single `uv run poe ci-checks` invocation fitness function 0
    # requires.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: weft
          POSTGRES_PASSWORD: weft
          POSTGRES_DB: weft
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U weft -d weft"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync
        run: uv sync --frozen

      - name: Run the canonical gate
        run: uv run poe ci-checks
        env:
          WEFT_DATABASE_URL: postgresql://weft:weft@localhost:5433/weft

  # Fitness function 1, primary half. Separate because it needs a clean environment
  # this repository's own virtualenv cannot provide: the kernel is installed alone,
  # and if anything it does not ship is reachable, the import fails.
  kernel-isolation:
    name: kernel imports standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install weft-kernel alone and import it
        run: uv run --no-project python scripts/check_kernel_isolated.py
