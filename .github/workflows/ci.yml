name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The canonical gate, invoked as one task rather than as a list of steps.
  #
  # This is deliberate, and fitness function 0 depends on it: the checks that run
  # in CI must be exactly the checks `poe ci-checks` runs locally. A workflow that
  # enumerates its own steps can drift from the composite, which is how an architecture
  # checker ends up in the repository and in nobody's gate.
  gate:
    name: ci-checks
    runs-on: ubuntu-latest
    # Same image, credentials, port and health check as `compose.yaml`'s **postgres** service —
    # the container a developer brings up with `docker compose up -d` and the one this job
    # provisions are the same container, not two descriptions of it that could drift apart. This
    # is provisioning the environment `ci-checks` runs in, not enumerating the gate's steps: the
    # gate step below is still the single `uv run poe ci-checks` invocation fitness function 0
    # requires.
    #
    # **This comment said "as `compose.yaml`" without naming the service, and that stopped being
    # true when Qdrant was added** — `compose.yaml` describes two services and this job provisions
    # one. That is not drift: Qdrant sits behind a `conformance` profile precisely so that
    # `docker compose up -d` still means "the one container, and it is the database", and this job
    # matches that default deliberately. What was wrong was a sentence claiming parity with a file
    # that had grown a second service. Corrected 2026-09-10, when `WEFT_EXPECTED_SKIPS` below made
    # the difference between the two environments a number for the first time.
    #
    # **Whether this job should also run the conformance backend is a real question and not one
    # this comment settles.** G4's two-backend proof is what `compose.yaml`'s qdrant service
    # exists for, and today it is proven on a developer's machine and never here.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: weft
          POSTGRES_PASSWORD: weft
          POSTGRES_DB: weft
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U weft -d weft"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      # `fetch-depth: 0` because part of this gate's subject **is** the git history.
      # `tests/docs/test_ledger_records_a_sha.py` asks whether the shas the ledger records name
      # commits still reachable from HEAD, and a depth-1 checkout can reach none of them — so the
      # job failed from 2026-09-07 with "not one recorded sha names a commit still reachable",
      # which is that check being asked its question in an environment that cannot answer it.
      # Green locally the whole time, because a developer's clone has the history. `docs/lessons.md`
      # `L7.2` and `L7.6` are the same shape twice over: the gate you ran is only the gate if the
      # environment is.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync
        run: uv sync --frozen

      - name: Run the canonical gate
        run: uv run poe ci-checks
        env:
          WEFT_DATABASE_URL: postgresql://weft:weft@localhost:5433/weft
          # **The operator's claim about how many tests should skip — `docs/lessons.md` `L11.22`,
          # and it lives here rather than in `pyproject.toml` because a skip count is a fact about
          # an *environment*.** This job declares its services and its install steps above, so it
          # is the one environment in this project that can honestly state the number. A
          # developer's machine declares nothing: measured on the author's, with Qdrant running,
          # the same tree skips 9; with Qdrant unreachable, 44; here, 48. A default pinned in
          # `pyproject.toml` would be red for everyone whose machine differs from whoever set it.
          #
          # `tests/conftest.py` fails the run when the count disagrees and says which direction.
          # **More** usually means a service this job provisions did not come up. **Fewer** means a
          # test that used to skip now runs, which is good news that has to be recorded — move this
          # number in the commit that changed it, the same ratchet discipline every waiver constant
          # in `tests/architecture/` uses.
          #
          # Before this existed, this job ran **39 fewer tests than a local gate** and reported
          # green on every push since Qdrant was added, which is `docs/lessons-archive.md` `L7.8`
          # living in CI rather than on a laptop.
          WEFT_EXPECTED_SKIPS: "48"

  # Fast feedback on a pull request, and **not a gate**. The `gate` job above is the canonical
  # full run and this job cannot stand in for it: it runs only the tests the diff can have
  # affected, which is a guess about impact, and fitness function 0's whole subject is that a
  # check outside the canonical task does not run. It exists so a broken unit test is visible in
  # a minute or two rather than after the full gate, and it is deliberately allowed to be
  # narrower than the truth. Nothing here may ever be cited as evidence that a branch is green.
  #
  # `fetch-depth: 0` because the selection is computed against the pull request's base commit,
  # which a shallow clone does not carry. It needs the same container the gate does, because a
  # change under `packages/` selects `tests/integration`.
  impacted:
    name: impacted tests (fast feedback, not a gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: weft
          POSTGRES_PASSWORD: weft
          POSTGRES_DB: weft
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U weft -d weft"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync
        run: uv sync --frozen

      - name: Run only the tests this pull request can have affected
        run: uv run poe test-impacted --base ${{ github.event.pull_request.base.sha }}
        env:
          WEFT_DATABASE_URL: postgresql://weft:weft@localhost:5433/weft

  # Fitness function 1, primary half. Separate because it needs a clean environment
  # this repository's own virtualenv cannot provide: the kernel is installed alone,
  # and if anything it does not ship is reachable, the import fails.
  kernel-isolation:
    name: kernel imports standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install weft-kernel alone and import it
        run: uv run --no-project python scripts/check_kernel_isolated.py

  # Fitness function 1, generalised to every published distribution — ledger task 6.6. Separate
  # from the `ci-checks` gate for the same reason `kernel-isolation` is: the distributions are
  # installed into clean environments, which is the whole check.
  #
  # **Those clean environments are the temporary venvs the script builds, not this runner's.** The
  # step below therefore runs *inside* the synced project environment, exactly as
  # `poe isolated-installs` does locally. It was copied from `kernel-isolation` with its
  # `--no-project` and no `Sync`, which works there only because `check_kernel_isolated.py` imports
  # nothing outside the standard library; this script reaches `publish_set.py`, which imports
  # pydantic, and died on it the first time CI ever ran.
  #
  # **The script is named here rather than invoked through its poe task**, which would otherwise be
  # the better shape. `tests/architecture/test_isolated_installs.py` asserts that
  # `check_isolated_installs.py` appears in this file, as its proxy for *this check runs in CI* —
  # so routing through `poe isolated-installs` satisfies the property and erases the evidence the
  # check reads. Naming the script keeps it green and matches the `sdists` job below. If that
  # assertion is ever generalised to accept the task name, this becomes a one-line simplification.
  isolated-installs:
    name: every distribution imports standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync
        run: uv sync --frozen

      - name: Install every published distribution alone and import it
        run: uv run python scripts/check_isolated_installs.py

  # Ledger task 6.7. Separate from `ci-checks` for the same reason `isolated-installs` is: it
  # builds and installs sdists into a clean environment `ci-checks`' own virtualenv cannot
  # provide. `--run-tests` also runs this repository's suite against the built artefacts, so it
  # needs the one container exactly as the `gate` job above does.
  sdists:
    name: every sdist carries what the checkout has
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: weft
          POSTGRES_PASSWORD: weft
          POSTGRES_DB: weft
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U weft -d weft"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync
        run: uv sync --frozen

      - name: Build every sdist, check completeness, and run the suite from the artefacts
        run: uv run python scripts/check_sdists.py --run-tests
        env:
          WEFT_DATABASE_URL: postgresql://weft:weft@localhost:5433/weft
