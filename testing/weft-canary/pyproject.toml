[project]
name = "weft-canary"
version = "0.1.0"
description = "Test-only distribution for fitness function 8. Never published."
requires-python = ">=3.12"
dependencies = ["weft-kernel>=0.1.0,<1.0.0", "pydantic>=2"]

# The one entry point a pack declares (`docs/02-extension-model.md` section 2).
# Fitness function 8(a) needs a *real* installed pack to refuse, so this
# distribution carries the same shape any other pack would — a single
# `weft.packs` entry point resolving to a `register` function. `register`
# must never actually run: every test that touches this distribution refuses
# it by an allow-list, and if `register` runs, that is 8(a) failing.
[project.entry-points."weft.packs"]
canary = "weft_canary:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# **Never published.** Ledger task 6.2; `docs/01-high-level-plan.md` → *Fitness functions* 10(a),
# which names this distribution as the clause's standing test case: it "must always be on the
# opt-out side and never in the publish job's arguments". A distribution whose whole purpose is to
# be *refused* by discovery has no business on an index, and the marker lives here rather than in a
# central exclusion list because a central list is a second description of the same fact and drifts
# from it. `tests/architecture/test_ff10_ship_set_integrity.py` reads this table.
[tool.weft]
publish = false
