# Task 32.10: `adjacent-chunks` and the composition against `retrieve-then-generate`, on
# `fetch.toml`'s 54 questions. Document-level IR is blind to widening by construction (32.0), so
# only the answer metrics are named. `context-recall` is left out: `weft eval experiment` scores
# only gate-safe metrics (`weft_cli/eval_scoring.py:528`), and it is a gate-unsafe judge.

[experiment]
schema = 1
name = "context-construction-en-fetch-widen"
questions = "../questions/fetch.toml"
corpus = "../../corpus/validation-en"
manifest = "../../corpus/manifest.toml"
repeats = 2
top_k = 5
metrics = ["token_recall", "rouge_l"]
minimum_detectable_effect = 0.08

[[arm]]
name = "baseline"
pipeline = "index-openai-large-pdf"
query_pipeline = "retrieve-then-generate"

[[arm]]
name = "adjacent-chunks"
pipeline = "index-openai-large-pdf"
query_pipeline = "adjacent-chunks-then-generate"

[[arm]]
name = "context-construction"
pipeline = "index-openai-large-pdf"
query_pipeline = "context-construction-then-generate"
