# Task 32.10: `dedupe` and `mmr` (with their sweeps) against `retrieve-then-generate`, paired
# within one invocation, on `fetch.toml`'s 54 questions. Document-level IR still sees these two
# arms; the answer metrics are scored beside it. `context-recall` cannot run here yet — see
# `context-construction-en-fetch-widen.toml`. MDE 0.08 is 32.0's, over the 107 English questions.

[experiment]
schema = 1
name = "context-construction-en-fetch-ir"
questions = "../questions/fetch.toml"
corpus = "../../corpus/validation-en"
manifest = "../../corpus/manifest.toml"
repeats = 2
top_k = 5
metrics = ["recall@5", "mrr@5", "ndcg@5", "token_recall", "rouge_l"]
minimum_detectable_effect = 0.08

[[arm]]
name = "baseline"
pipeline = "index-openai-large-pdf"
query_pipeline = "retrieve-then-generate"

[[arm]]
name = "dedupe"
pipeline = "index-openai-large-pdf"
query_pipeline = "dedupe-then-generate"

[[arm]]
name = "dedupe-t030"
pipeline = "index-openai-large-pdf"
query_pipeline = "dedupe-threshold-t030-then-generate"

[[arm]]
name = "dedupe-t070"
pipeline = "index-openai-large-pdf"
query_pipeline = "dedupe-threshold-t070-then-generate"

[[arm]]
name = "mmr"
pipeline = "index-openai-large-pdf"
query_pipeline = "mmr-then-generate"

[[arm]]
name = "mmr-w030"
pipeline = "index-openai-large-pdf"
query_pipeline = "mmr-relevance-w030-then-generate"

[[arm]]
name = "mmr-w100"
pipeline = "index-openai-large-pdf"
query_pipeline = "mmr-relevance-w100-then-generate"
