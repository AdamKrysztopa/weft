# distant-synthesis (033-040)
# ---------------------------------------------------------------------------

[[question]]
id = "global-heldout-033"
text = "Trace how the randomized dependence coefficient, introduced as a general statistical tool, gets used or bypassed in two very different applied feature-selection settings."
language = "en"
relevant_documents = ["arxiv/1304.7717v2.pdf", "arxiv/1908.05376v1.pdf", "arxiv/1903.01907v1.pdf"]
reference_answer = "Lopez-Paz, Hennig and Schoelkopf introduce the randomized dependence coefficient purely as a fast, general-purpose estimator of non-linear statistical dependence, defined through copula transforms, random non-linear projections and canonical correlation, with no reference to any specific application. Zhao, Anand and Wang pick up this exact statistic and offer it as an optional redundancy measure inside an mRMR variant built for marketing feature selection at Uber, treating it as one candidate among several rather than the default choice. Li and Gu, working on power-system transient-stability feature selection, never adopt a non-linear dependence statistic at all and do not raise the randomized dependence coefficient's motivating concern about non-linear association; their own stated worry is different, that the standard mutual-information difference criterion is too blunt an instrument to weigh relevance against redundancy well, which they address by adding a single tunable weighting factor rather than by changing the dependence measure itself. So one applied paper reuses the randomized dependence coefficient's exact statistic while the other addresses an unrelated concern with an unrelated fix, illustrating how differently 'redundancy' gets engineered once it leaves the original RDC paper."
notes = "Corrected: the draft originally attributed to Li and Gu a stated worry about non-linear dependence that their paper does not express; their own stated motivation (the difference criterion being too blunt to balance relevance and redundancy) is unrelated to RDC's non-linear-association motivation, so the two applied papers are contrasted on that basis instead."
axes = { global-type = "distant-synthesis", split = "held-out" }

[[question]]
id = "global-heldout-034"
text = "Connect Gao et al.'s theoretical critique of mutual-information-based feature selection to how two applied papers, BoMGene and MRmMC, actually handle the same underlying issue."
language = "en"
relevant_documents = ["arxiv/1606.02827v1.pdf", "arxiv/2510.00907v1.pdf", "mrmr/Senawi et al. - 2017 - A new maximum relevance-minimum multicollinearity .pdf"]
reference_answer = "Gao, Ver Steeg and Galstyan show that the standard low-order mutual-information approximations behind greedy selectors such as mRMR rest on independence assumptions that cannot generally both hold, calling into question the theoretical soundness of using plain mutual information this way. Phan et al.'s BoMGene nonetheless uses mutual-information-flavored mRMR scoring as its first-stage global filter for gene-expression classification without engaging with this critique, relying instead on the second-stage Boruta wrapper to correct for whatever imperfect features the first stage lets through. Senawi, Wei and Billings sidestep the critique from a different angle, having already abandoned mutual information in favor of a correlation-based statistic for reasons of estimation reliability rather than the specific inconsistency Gao et al. identify, so their method happens not to be exposed to that particular theoretical objection at all."
notes = "Draws on the VMI paper's theoretical argument and two applied papers' independent, non-engaging responses to the same underlying weakness."
axes = { global-type = "distant-synthesis", split = "held-out" }

[[question]]
id = "global-heldout-035"
text = "Connect the big-data engineering optimizations in fast-mRMR and N3LARS to the concrete production scale described in the Uber marketing platform paper."
language = "en"
relevant_documents = ["mrmr/Ramírez-Gallego et al. - 2017 - Fast-mRMR Fast Minimum Redundancy Maximum Relevan.pdf", "arxiv/1411.2331v1.pdf", "arxiv/1908.05376v1.pdf"]
reference_answer = "Ramirez-Gallego et al. optimize mRMR's data-access pattern and offer GPU and Spark implementations specifically to handle feature counts and instance counts that make the naive quadratic-cost algorithm impractical, reporting benefits once instance counts exceed roughly a hundred thousand or feature counts exceed a couple of thousand. Yamada et al.'s N3LARS reaches for a different technique, a convex LARS-style reformulation of an HSIC-based redundancy criterion, to reach the same kind of scale, and explicitly designs it to run under Hadoop or Spark's map-reduce model. Zhao, Anand and Wang's description of an mRMR variant running inside a Scala Spark training pipeline at Uber, processing large marketing datasets and needing to run reliably enough to power a randomized online experiment, is a concrete instance of exactly the scale both engineering papers are built to serve."
notes = "Draws on fast-mRMR's and N3LARS's differing scalability techniques and the Uber paper's description of large-scale production use."
axes = { global-type = "distant-synthesis", split = "held-out" }

[[question]]
id = "global-heldout-036"
text = "Using Ding and Peng's original mRMR as the common starting point, how do Radovic et al.'s temporal extension and Venkateswara et al.'s global combinatorial formulation pull the same base idea in opposite directions?"
language = "en"
relevant_documents = ["arxiv/radovic-2017-bmc.pdf", "arxiv/1706.07535v1.pdf", "mrmr/Ding i Peng - 2005 - MINIMUM REDUNDANCY FEATURE SELECTION FROM MICROARR.pdf"]
reference_answer = "Ding and Peng's original mRMR greedily adds one feature at a time to maximize relevance to the class label while minimizing redundancy with features already chosen, treating each feature as a fixed, non-temporal vector of values. Radovic et al. extend this idea toward preserving structure the original method discards, keeping each gene's full time-series form intact and replacing static redundancy with a dynamic-time-warping comparison between whole trajectories, at the cost of added computational complexity for a more faithful representation of temporal genes. Venkateswara et al. extend the same base idea in the opposite direction, toward global optimality rather than temporal fidelity, reformulating relevance-redundancy feature selection as a single combinatorial binary quadratic problem over pairwise conditional mutual information and accepting an NP-hard optimization that must be approximated, in exchange for scoring an entire feature subset jointly rather than greedily one feature at a time."
notes = "Draws on Ding and Peng's baseline greedy formulation and the two papers' opposite extensions toward temporal fidelity versus global combinatorial scoring."
axes = { global-type = "distant-synthesis", split = "held-out" }

[[question]]
id = "global-heldout-037"
text = "Connect SmRMR's false-discovery-rate control to the accuracy-driven feature-count selection used in the power-system and solar-forecasting papers, and what this difference suggests about each domain's tolerance for a wrong feature."
language = "en"
relevant_documents = ["arxiv/2508.18901v1.pdf", "arxiv/1903.01907v1.pdf", "mrmr/Bouzgou i Gueymard - 2017 - Minimum redundancy – Maximum relevance with extrem.pdf"]
reference_answer = "Naylor, Poignard, Climente-Gonzalez and Yamada build a second stage into their sparse mRMR method specifically to bound the false discovery rate at a pre-specified confidence level, treating the risk of keeping a spuriously active feature as something needing an explicit statistical guarantee rather than just good downstream accuracy. Li and Gu instead pick their final feature subset purely by which nested candidate subset gives the highest cross-validated support-vector-machine accuracy on grid-stability test systems, with no separate step bounding the chance that an included feature is actually uninformative. Bouzgou and Gueymard make the same kind of accuracy-driven choice for solar forecasting, selecting among windowing and dimensionality-reduction scenarios by forecast error rather than any formal discovery-rate guarantee. The contrast suggests that domains built around commercial forecasting accuracy are content to let cross-validated performance stand in for feature correctness, while a screening method aimed at potentially scientific discovery treats an explicit error-rate guarantee as worth the extra machinery."
notes = "Draws on SmRMR's explicit false-discovery-rate-control mechanism versus the purely accuracy-driven subset selection in the transient-stability and solar-forecasting papers."
axes = { global-type = "distant-synthesis", split = "held-out" }

[[question]]
id = "global-heldout-038"
text = "Using the randomized dependence coefficient's invariance to monotonic marginal transformations as a reference point, what do the correlation- and mutual-information-based redundancy measures in MRmMC and ImRMR give up by not using a copula-based statistic like it?"
language = "en"
relevant_documents = ["mrmr/Lopez-Paz et al. - The Randomized Dependence Coefficient.pdf", "mrmr/Senawi et al. - 2017 - A new maximum relevance-minimum multicollinearity .pdf", "mrmr/Xie et al. - 2023 - A new improved maximal relevance and minimal redun.pdf"]
reference_answer = "Lopez-Paz, Hennig and Schoelkopf's randomized dependence coefficient is built from empirical copula transforms specifically so that its value does not change under any monotonically increasing transformation applied separately to either variable, meaning it responds only to the underlying dependence structure and not to the particular scale or shape of each feature's marginal distribution. Senawi, Wei and Billings' conditional correlation coefficient in MRmMC does not have this property: because it is a correlation-style statistic, rescaling or non-linearly re-expressing a feature's values can change the measured redundancy even when the underlying dependence has not changed, which is part of why the authors flag it as most reliable only for quantitative features related in a sufficiently regular way. Xie et al.'s ImRMR mixes Pearson correlation with mutual information for its subset-level relevance and redundancy scores, gaining mutual information's greater flexibility for that component but still inheriting the same marginal-sensitivity limitation through its correlation component. Neither applied method achieves the randomized dependence coefficient's specific marginal-invariance guarantee, trading it for simplicity and lower computational cost."
notes = "Draws on RDC's stated invariance property and the correlation- and mutual-information-based measures used by MRmMC and ImRMR that lack it."
axes = { global-type = "distant-synthesis", split = "held-out" }

[[question]]
id = "global-heldout-039"
text = "Connect VMR_mRMR's finding about which partitioning strategy suits which data shape to the actual data shapes described in the BoMGene gene-expression paper and the Uber marketing platform paper."
language = "en"
relevant_documents = ["arxiv/2208.09901v2.pdf", "arxiv/2510.00907v1.pdf", "arxiv/1908.05376v1.pdf"]
reference_answer = "Yelleti and Prasad report that their vertical-partitioning MapReduce approach to mRMR performs best on datasets with a large feature space and a comparatively moderate number of samples, while a horizontal-partitioning cousin framework performs better when the sample count is large and the feature space is moderate. Phan et al.'s BoMGene operates on gene-expression datasets, the classic microarray shape with many thousands of genes measured on comparatively few patient samples, which matches the wide, feature-heavy regime VMR_mRMR's vertical partitioning is reported to favor. Zhao, Anand and Wang's Uber marketing platform instead works over large-scale user-activity datasets with many samples relative to a more moderate, engineered feature set, closer to the tall, sample-heavy regime VMR_mRMR reports favoring horizontal partitioning for instead. Neither applied paper actually uses a MapReduce-partitioned mRMR implementation, but their described data shapes illustrate the two regimes VMR_mRMR's comparison is built around."
notes = "Draws on VMR_mRMR's stated partitioning-versus-data-shape finding and the contrasting data shapes described in BoMGene and the Uber paper."
axes = { global-type = "distant-synthesis", split = "held-out" }

[[question]]
id = "global-heldout-040"
text = "Trace one line of development for non-linear dependence measures in feature selection, from the randomized dependence coefficient as a general statistic, through N3LARS's use of a related kernel-based criterion, to SmRMR's comparison against HSIC-LASSO."
language = "en"
relevant_documents = ["mrmr/Lopez-Paz et al. - The Randomized Dependence Coefficient.pdf", "arxiv/1411.2331v1.pdf", "arxiv/2508.18901v1.pdf"]
reference_answer = "The randomized dependence coefficient paper establishes a general, computationally cheap statistic for non-linear dependence between arbitrary random variables, built from copula transforms, random non-linear feature projections and canonical correlation, without tying it to any particular downstream selection algorithm. Yamada, Saha, Ouyang, Yin and Chang's N3LARS develops a related but distinct line, building its redundancy-aware selection method around the Hilbert-Schmidt Independence Criterion, a kernel-based dependence measure with its own theoretical grounding, and reformulating the resulting HSIC Lasso objective as a convex, incrementally solvable optimization suited to very large and high-dimensional data. Naylor, Poignard, Climente-Gonzalez and Yamada's SmRMR paper then compares its own penalized, screening-oriented version of mRMR directly against HSIC-LASSO, the method N3LARS is built to make scalable, showing how a kernel-based non-linear dependence idea introduced for one purpose becomes the benchmark against which a later, statistically motivated screening method measures itself."
notes = "Draws on RDC's general framing, N3LARS's HSIC-based reformulation, and SmRMR's explicit comparison against HSIC-LASSO."
axes = { global-type = "distant-synthesis", split = "held-out" }
