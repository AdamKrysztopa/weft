# V2 question set (`docs/09-release.md` §4.3) — the Polish round: written from the Wikipedia
# subset, in Polish, because untested language handling is the reference's `language == 'pl'`
# branch with the branch removed.
#
# `eval/check_questions.py` owns the schema, every rule these entries are refused by, and
# the argument for why nothing written here may be believed until
# `tests/docs/test_question_set.py` has read it back out of the corpus. This file holds
# questions and no design.
#
# **Provenance, which V2 requires recorded per answer.** Each question was written by an LLM
# agent (Claude Opus 5, 2026-08-17) that had read the document it names, from the passage
# quoted beside it, and was checked by a second, independent agent; `notes` carries the
# per-question detail. This is not human-expert ground truth and must not be reported as
# though it were — those agents verified their own quotes, and a mechanical re-check still
# rejected 4 of 287 as appearing nowhere in the file they named.

[[question]]
id = "polish-001"
text = "Ile wynosi entropia pojedynczej litery, gdy alfabet ma 26 równie prawdopodobnych liter, i jaką entropię ma ośmioznakowe hasło złożone z takich liter?"
language = "pl"
kind = "quantitative"
difficulty = "easy"
relevant_documents = ["pl-entropia-teoria-informacji"]
reference_answer = "Przy 26 równie prawdopodobnych literach entropia każdej z nich wynosi około 4,7, a ośmioznakowy ciąg liter używany jako hasło ma entropię 37,6. Uproszczony wzór stosuje się wtedy, gdy prawdopodobieństwa poszczególnych zdarzeń w zbiorze są równe."
notes = "Ground truth napisany przez agenta Claude (Opus 5) 17.08.2026 na podstawie sekcji „Przykład” artykułu o entropii. Cytaty zweryfikowane przez grep -F (dopasowanie dokładne, ze zdwojonymi spacjami po usuniętych wzorach)."

  [[question.quote]]
  document = "pl-entropia-teoria-informacji"
  page = 0
  text = "Przykładowo dla zbioru 26 liter alfabetu entropia każdej z nich wynosi około 4,7, więc ośmioznakowy ciąg liter wykorzystywany np. jako hasło będzie miał entropię 37,6."

  [[question.quote]]
  document = "pl-entropia-teoria-informacji"
  page = 0
  text = "W przypadku, gdy prawdopodobieństwa poszczególnych zdarzeń w zbiorze są równe, powyższy wzór można stosować w postaci uproszczonej:"

