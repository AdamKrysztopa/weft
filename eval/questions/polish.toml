[[question]]
id = "polish-007"
text = "Czym drzewa ExtraTrees różnią się od zwykłych lasów losowych?"
language = "pl"
kind = "comparative"
difficulty = "medium"
relevant_documents = ["pl-las-losowy"]
reference_answer = "Są dwie główne różnice: każde drzewo ExtraTrees jest szkolone przy użyciu całej próbki uczenia się, a nie próbki początkowej (bootstrapowej), oraz rozdzielanie odgórne drzewa jest losowe. Zamiast obliczać lokalnie optymalny punkt odcięcia dla każdej rozważanej cechy, wybierany jest losowy punkt odcięcia, a spośród wszystkich losowo wygenerowanych podziałów wybierany jest ten o najwyższym wyniku."
notes = "Ground truth: agent Claude (Opus 5), 17.08.2026, sekcja „ExtraTrees” w pl-las-losowy.txt. Cytaty zweryfikowane grep -F."

  [[question.quote]]
  document = "pl-las-losowy"
  page = 0
  text = "Zamiast obliczać lokalnie *optymalny* punkt odcięcia dla każdej rozważanej cechy (przykładowo na podstawie wzmocnienia informacji lub zanieczyszczenia Giniego), *wybierany* jest *losowy* punkt odcięcia. Ta wartość jest wybierana z jednolitego rozkładu w zakresie empirycznym elementu (w zestawie treningowym drzewa). Następnie, spośród wszystkich losowo wygenerowanych podziałów, podział, który daje najwyższy wynik, jest wybierany do podziału węzła."

  [[question.quote]]
  document = "pl-las-losowy"
  page = 0
  text = "Zamiast obliczać lokalnie *optymalny* punkt odcięcia dla każdej rozważanej cechy"

[[question]]
id = "polish-008"
text = "Jakie wady ma permutacyjna ocena ważności cech w lasach losowych?"
language = "pl"
kind = "limitation"
difficulty = "medium"
relevant_documents = ["pl-las-losowy"]
reference_answer = "Ważność mierzy się permutując wartości danej cechy w danych treningowych i licząc ponownie błąd baggingu na zaburzonym zbiorze, ale metoda ta ma wady: przy zmiennych kategorycznych o różnej liczbie poziomów lasy losowe sprzyjają atrybutom z większą liczbą poziomów, a gdy dane zawierają grupy skorelowanych cech o podobnym znaczeniu, faworyzowane są grupy mniejsze kosztem większych."
notes = "Ground truth: agent Claude (Opus 5), 17.08.2026, sekcja „Znaczenie zmiennych” w pl-las-losowy.txt. Pytanie istotne dla korpusu o selekcji cech — dotyczy obciążenia rankingu ważności. Cytaty zweryfikowane grep -F (w pierwszym zachowano puste miejsca po symbolach)."

  [[question.quote]]
  document = "pl-las-losowy"
  page = 0
  text = "Aby zmierzyć znaczenie -tej cechy po treningu, wartości -tej cechy są permutowane wśród danych treningowych, a błąd tego baggingu jest ponownie obliczany na tym zaburzonym zbiorze danych."

  [[question.quote]]
  document = "pl-las-losowy"
  page = 0
  text = "W przypadku danych, w tym zmiennych kategorycznych o różnej liczbie poziomów, losowe lasy sprzyjają tym atrybutom z większą liczbą poziomów."

  [[question.quote]]
  document = "pl-las-losowy"
  page = 0
  text = "Jeśli dane zawierają grupy skorelowanych cech o podobnym znaczeniu dla danych wyjściowych, mniejsze grupy są faworyzowane w stosunku do większych grup."

[[question]]
id = "polish-009"
text = "Dlaczego las losowy jest mniej podatny na przeuczenie niż pojedyncze głębokie drzewo decyzyjne?"
language = "pl"
kind = "cross-document"
difficulty = "hard"
relevant_documents = ["pl-las-losowy", "pl-nadmierne-dopasowanie"]
reference_answer = "Bardzo głębokie drzewa uczą się wysoce nieregularnych wzorów i dopasowują się nadmiernie do zestawów treningowych — mają niskie obciążenie, ale bardzo dużą wariancję — czyli świetnie dopasowują się do danych uczących, a dają słabe wyniki na danych, z którymi nie zetknęły się podczas uczenia. Las losowy uśrednia wiele głębokich drzew wyszkolonych na różnych częściach tego samego zestawu treningowego, co zmniejsza wariancję i poprawia tendencję drzew do nadmiernego dopasowywania się."
notes = "Pytanie krzyżowe: mechanizm z pl-las-losowy.txt, definicja skutku przeuczenia z pl-nadmierne-dopasowanie.txt. Ground truth: agent Claude (Opus 5), 17.08.2026; cytaty zweryfikowane grep -F."

  [[question.quote]]
  document = "pl-las-losowy"
  page = 0
  text = "W szczególności drzewa, które są bardzo głębokie, mają tendencję do uczenia się wysoce nieregularnych wzorów: dopasowują się nadmiernie do zestawów treningowych, to znaczy mają niskie obciążenie, ale bardzo dużą wariancję."

  [[question.quote]]
  document = "pl-las-losowy"
  page = 0
  text = "Losowe lasy są sposobem uśredniania wielu głębokich drzew decyzyjnych, wyszkolonych na różnych częściach tego samego zestawu treningowego, w celu zmniejszenia wariancji."

  [[question.quote]]
  document = "pl-nadmierne-dopasowanie"
  page = 0
  text = "modele o dużej złożoności mogą świetnie dopasować się do danych uczących, jednak będą dawały słabe wyniki, gdy zastosuje się je do danych, z którymi nie zetknęły się podczas uczenia."

