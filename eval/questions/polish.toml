kind = "methodological"
difficulty = "medium"
relevant_documents = ["pl-analiza-glownych-skladowych"]
reference_answer = "Przy użyciu macierzy kowariancji największy wpływ na wynik mają zmienne o największej wariancji, co jest wskazane, gdy zmienne reprezentują porównywalne wielkości. Użycie macierzy korelacji odpowiada wstępnej normalizacji zbioru wejściowego tak, aby każda zmienna miała identyczną wariancję, co jest wskazane, gdy wartości zmiennych nie są porównywalne."
notes = "Ground truth: agent Claude (Opus 5), 17.08.2026, z trzeciego akapitu pl-analiza-gownych-skadowych.txt. Oba cytaty zweryfikowane grep -F."

  [[question.quote]]
  document = "pl-analiza-glownych-skladowych"
  page = 0
  text = "W przypadku użycia macierzy kowariancji, zmienne w zbiorze wejściowym o największej wariancji mają największy wpływ na wynik, co może być wskazane, jeśli zmienne reprezentują porównywalne wielkości, np. procentowe zmiany kursów różnych akcji. Użycie macierzy korelacji natomiast odpowiada wstępnej normalizacji zbioru wejściowego tak, aby każda zmienna miała na wejściu identyczną wariancję, co może być wskazane, jeśli wartości zmiennych nie są porównywalne."

  [[question.quote]]
  document = "pl-analiza-glownych-skladowych"
  page = 0
  text = "Użycie macierzy korelacji natomiast odpowiada wstępnej normalizacji zbioru wejściowego tak, aby każda zmienna miała na wejściu identyczną wariancję"

