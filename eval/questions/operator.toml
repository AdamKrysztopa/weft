[[question]]
id = "operator-007"
text = "In the Ding and Peng microarray study, what does the MRMR acronym stand for, and which two criteria does the framework combine?"
language = "en"
kind = "definitional"
difficulty = "easy"
relevant_documents = ["ding-i-peng-2005-minimum-redundancy-feature-sele"]
reference_answer = "MRMR stands for minimum redundancy — maximum relevance. It supplements a minimum redundancy criterion (features made maximally dissimilar to each other, e.g. by minimising their pair-wise correlations) with the usual maximum relevance criterion, such as maximal mutual information with the target phenotypes."
notes = "Provenance: authored by Claude (ground-truth subagent) from Ding & Peng (2005), J. Bioinform. Comput. Biol. 3(2):185-205, Sec. 2, page 3 of the extracted text. Deliberately not answerable from the title alone: the title never expands the acronym or names the two criteria."

  [[question.quote]]
  document = "ding-i-peng-2005-minimum-redundancy-feature-sele"
  page = 3
  text = """
we propose to expand the representative power of
the feature set by requiring that features are maximally dissimilar to each other,
for example, their mutual Euclidean distances are maximized, or their pair-wise
correlations are minimized. These minimum redundancy criteria are supplemented
by the usual maximum relevance criteriasuch as maximal mutual information with
the target phenotypes. We therefore call this approach the minimum redundancy —
maximum relevance (MRMR) approach.
"""

