kind = "definitional"
difficulty = "easy"
relevant_documents = ["lopez-paz-et-al-the-randomized-dependence-coeffi"]
reference_answer = "RDC defines dependence between two random variables as the largest canonical correlation between random non-linear projections of their respective empirical copula transformations. It is invariant to monotonically increasing transformations, works on random variables of arbitrary dimension, and costs O(n log n) in the sample size."
notes = "Provenance: answer written by the ground-truth authoring agent (Claude Opus 5) from PAGE 1, Section 1 Introduction, of lopez-paz-et-al-the-randomized-dependence-coeffi.txt. Definitional but deliberately paired with the complexity claim so the answer is not merely the title."

