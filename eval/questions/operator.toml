# V2 question set (`docs/09-release.md` §4.3) — the operator round: written while the
# copyrighted mRMR papers were on disk. Twelve of these turned out to rest only on documents
# the reproducible tiers already carry, which is why the round is not a tier and nothing reads
# one off this file name.
#
# `eval/check_questions.py` owns the schema, every rule these entries are refused by, and
# the argument for why nothing written here may be believed until
# `tests/docs/test_question_set.py` has read it back out of the corpus. This file holds
# questions and no design.
#
# **Provenance, which V2 requires recorded per answer.** Each question was written by an LLM
# agent (Claude Opus 5, 2026-08-17) that had read the document it names, from the passage
# quoted beside it, and was checked by a second, independent agent; `notes` carries the
# per-question detail. This is not human-expert ground truth and must not be reported as
# though it were — those agents verified their own quotes, and a mechanical re-check still
# rejected 4 of 287 as appearing nowhere in the file they named.

[[question]]
id = "operator-001"
text = "In Bouzgou and Gueymard's solar forecasting study, what distinguishes filter variable-selection methods from wrapper methods?"
language = "en"
kind = "definitional"
difficulty = "easy"
relevant_documents = ["bouzgou-i-gueymard-2017-minimum-redundancy-maxim"]
reference_answer = "Filter methods preprocess the time series to rank the predictive strength of the historical variables, so the ranking is done independently of the forecaster. Wrapper methods instead build the selection around a search algorithm that tailors a data subset for maximum forecasting performance, using the predictor's own performance as the objective function for evaluating a candidate subset."
notes = "Definitional contrast stated in Section 3.2 (Methodology), not in the abstract. A retriever must reach the filter/wrapper paragraph pair on page 4."

  [[question.quote]]
  document = "bouzgou-i-gueymard-2017-minimum-redundancy-maxim"
  page = 4
  text = """
ﬁlter methods basically consist of a preprocessing of the time series to
rank the predictive strength of the historical variables.
"""

  [[question.quote]]
  document = "bouzgou-i-gueymard-2017-minimum-redundancy-maxim"
  page = 4
  text = """
In wrapper methods the forecasting technique is centered on a
powerful search algorithm, whose goal is to tailor a data subset that will
give the maximum possible forecasting performance.
"""

  [[question.quote]]
  document = "bouzgou-i-gueymard-2017-minimum-redundancy-maxim"
  page = 4
  text = """
Wrapper methods
use the predictor performance as the objective function to evaluate the
variable subset.
"""

