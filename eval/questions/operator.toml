kind = "methodological"
difficulty = "medium"
relevant_documents = ["ding-i-peng-2005-minimum-redundancy-feature-sele"]
reference_answer = "An exact solution to the MRMR requirements would require O(N^|S|) searches over the whole gene set, so they settle for a near-optimal solution from a simple heuristic: the first feature is the one with the highest I(h,i), and further features are added incrementally while earlier selected features stay in the set. These incremental optimizations run in O(|S|·N) complexity."
notes = "Provenance: authored by Claude (ground-truth subagent) from Ding & Peng (2005), Sec. 3.1, pages 4-5 of the extracted text. Note the PDF extraction mangles the exponent: 'O(N |S|)s e a r c h e s' is the damaged rendering of O(N^|S|) searches; the quote is left exactly as extracted."

