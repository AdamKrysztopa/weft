relevant_documents = ["ax-1304.7717v2"]
reference_answer = "Feature selection is done greedily by dependence maximization: at each iteration i the feature x(i) not already in G_{i-1} that maximizes the dependence between the enlarged feature set G_i = {G_{i-1}, x(i)} and the target variable y is added, for i = 1..10, starting from the empty set. The objective is to build the feature subset that minimizes the normalized mean squared regression error (NMSE) of a Gaussian process regressor. Because dCor, MMD and CMMD have quadratic computational demands, they are restricted to at most 1,000 points when measuring dependence — a constraint that only bound on the sarcos and calcensus datasets — and results are averaged over 20 random training/test partitions."
notes = "Written by Claude (Opus 5) from Section 5.2. Caution for graders: the paper is internally inconsistent about the dataset count (it says 'eight real-world datasets' in one sentence and 'We considered 12 heterogeneous datasets' two sentences later), so the reference answer deliberately does not assert a count."

