language = "en"
kind = "methodological"
difficulty = "medium"
relevant_documents = ["ax-2508.18901v1"]
reference_answer = "Constructing the knockoff variables requires the sample size condition 2p_n < n, which is often not satisfied in practice. To get around it the authors use a data splitting procedure that builds on Section 4.1 of Barber and Candes (2019): on a first sub-sample they run a feature screening step to select a subset of variables S0 (a subset of {1,...,p_n}), and then apply the knockoff procedure on the remaining data using only those screened variables."
notes = "Section 4 (FDR control), page 13 — methods, not the abstract. Ground truth written by Claude (Opus 5) from the quoted passage alone."

  [[question.quote]]
  document = "ax-2508.18901v1"
  page = 13
  text = """
One key hurdle of step (1) when constructing the knockoff variables is the sample size requirement
2pn<n , which is often not satisfied in practice. To circumvent this issue and apply the knockoff,
we consider a data splitting procedure that builds upon Section 4.1 of Barber and Candès [2019]:
on a first sub-sample, we perform a feature screening step to select a subset of variables, say
bS0⊂{ 1,...,p n}; using the screened variables only, we employ the knockoff procedure on the
remaining data.
"""

