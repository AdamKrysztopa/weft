  page = 7
  text = """
mizes the normalized mean squared regression error (NMSE) of a Gaussian process regressor. We
do so by selecting the featurex(i) maximizing dependence between the feature setGi ={Gi−1,x (i)}
and the target variabley at each iterationi∈{ 1,... 10}, such thatG0 ={∅} andx(i) /∈G i−1.
"""

  [[question.quote]]
