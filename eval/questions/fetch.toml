# V2 question set (`docs/09-release.md` §4.3) — the open-access round: written from the
# arXiv and BMC papers, which anyone can fetch.
#
# `eval/check_questions.py` owns the schema, every rule these entries are refused by, and
# the argument for why nothing written here may be believed until
# `tests/docs/test_question_set.py` has read it back out of the corpus. This file holds
# questions and no design.
#
# **Provenance, which V2 requires recorded per answer.** Each question was written by an LLM
# agent (Claude Opus 5, 2026-08-17) that had read the document it names, from the passage
# quoted beside it, and was checked by a second, independent agent; `notes` carries the
# per-question detail. This is not human-expert ground truth and must not be reported as
# though it were — those agents verified their own quotes, and a mechanical re-check still
# rejected 4 of 287 as appearing nowhere in the file they named.

[[question]]
id = "fetch-001"
text = "According to the Randomized Dependence Coefficient paper, what three steps make up the construction of the RDC statistic?"
language = "en"
kind = "methodological"
difficulty = "easy"
relevant_documents = ["ax-1304.7717v2"]
reference_answer = "RDC is built in three steps: (1) the copula transformation of each of the two random samples; (2) projection of those copulas through k randomly chosen non-linear maps; and (3) computation of the largest canonical correlation between the two resulting sets of non-linear random projections."
notes = "Written by Claude (Opus 5) from Section 3 of arXiv:1304.7717v2. Answer follows from the quoted passage alone; the enumeration is stated explicitly there."

  [[question.quote]]
  document = "ax-1304.7717v2"
  page = 2
  text = """
we describe the three necessary steps to construct the RDC statistic: copula-transformation of each
of the two random samples (Section 3.1), projection of the copulas throughk randomly chosen non-
linear maps (Section 3.2) and computation of the largest canonical correlation between the two sets
of non-linear random projections (Section 3.3).
"""

[[question]]
id = "fetch-002"
text = "Why do the authors of the RDC paper argue that it is undesirable to approximate the HGR maximum correlation coefficient exactly on finite datasets, and what does RDC do instead?"
language = "en"
kind = "methodological"
difficulty = "hard"
relevant_documents = ["ax-1304.7717v2"]
reference_answer = "Because on a finite sample the supremum defining HGR degenerates: the finite-sample version of the HGR definition is constant and equal to 1 for continuous random variables, so it carries no information about dependence. The paper concludes that any meaningful measure of dependence estimated from finite samples must therefore rely on some form of regularization, and RDC obtains that regularization by approximating the space of Borel-measurable functions with the restricted function class F of Theorem 4."
notes = "Written by Claude (Opus 5) from Section 4 ('Relationship to the HGR coefficient'). Requires the methods/properties section, not the abstract. Two passages quoted because the answer has two halves."

  [[question.quote]]
  document = "ax-1304.7717v2"
  page = 5
  text = """
Therefore, the ﬁnite-sample version of Equation (1) is con-
stant and equal to “1” for continuous random variables. Meaningful measures of dependence from
ﬁnite samples thus must rely on some form of regularization.
"""

  [[question.quote]]
  document = "ax-1304.7717v2"
  page = 5
  text = """
RDC achieves this by approximating
the space of Borel measurable functions with the restricted function classF from Theorem 4:
"""

