[[question]]
id = "fetch-049"
text = "Why are the gene expression time series z-score normalized before the DTW distance matrix is computed? What weakness of DTW does this address?"
language = "en"
kind = "methodological"
difficulty = "medium"
relevant_documents = ["oa-radovic-2017-bmc"]
reference_answer = "DTW can align curves that are out of phase in time, but it may fail to recognise similarity between curves that fluctuate in a similar manner while having different offsets and amplitudes — the paper's example is one signal fluctuating between 5 and 10 and another fluctuating similarly between 30 and 40. Z-score normalization is applied before computing the distance matrix because it translates the gene expression time series so they fluctuate around the same (zero) offset and removes differences in amplitudes, leaving the series differing only in shape, which is what the redundancy measure is meant to compare."
notes = "Methods only; absent from the abstract. The 5-to-10 versus 30-to-40 illustration sits between the two quoted spans in the same paragraph on page 4. Reference answer written by Claude (Opus 5)."

  [[question.quote]]
  document = "oa-radovic-2017-bmc"
  page = 4
  text = """
Although DTW is able to capture similarity between
curves that are out of phase in time it may fail to capture
similarity between curves fluctuating in a similar manner
but with different offsets and amplitudes. For instance,
onesignalmayfluctuatewithamplitudebetween5and10,
whileanothersignalmayfluctuateinasimilarmannerbut
with larger amplitude between 30 and 40.
"""

  [[question.quote]]
  document = "oa-radovic-2017-bmc"
  page = 4
  text = """
Z-score
normalization ’translates’ gene expression time series to
fluctuate around the same (zero) offset and removes dif-
ferences in amplitudes.
"""

