[[question]]
id = "unanswerable-008"
text = "What classification accuracy did ImRMR achieve on the NCI and Lymphoma microarray gene expression datasets?"
language = "en"
kind = "unanswerable"
difficulty = "medium"
relevant_documents = []
reference_answer = "The corpus does not report this. Xie et al. evaluate ImRMR on seven datasets — Musk, Urban land cover, Glass, Libras Movement, Ionosphere, Pavia University and Crane songs — and none of them is a microarray dataset; NCI and Lymphoma appear only in Ding and Peng's separate study, which does not evaluate ImRMR. A correct system should say that no ImRMR result on NCI or Lymphoma exists in the corpus."
notes = "specific-but-absent (with a cross-document false premise). Confirmed by grep -Fic 'lymphoma' on xie-et-al-2023-*.txt = 0 hits. I read Xie section 5.2 'Experimental datasets', which enumerates exactly seven sets (five UCI: Musk, Urban, Glass, Movement, Ionosphere; plus hyperspectral Pavia University and Crane songs), and Table 4's comparative analysis, whose only dataset rows are Ionosphere, Crane, Movement and Musk. NCI and Lymphoma belong to Ding & Peng's six microarray sets, so a retriever will plausibly return both papers and must not splice them."

[[question]]
