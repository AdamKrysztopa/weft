difficulty = "medium"
relevant_documents = []
reference_answer = "The corpus reports no such numbers. No paper here evaluates on MNIST, CIFAR-10 or any image-classification benchmark — the evaluations use microarray gene expression data, UCI tabular sets, hyperspectral and audio data, solar irradiance time series, LibSVM large-scale sets and Uber marketing data. A correct system should state that no MNIST or CIFAR-10 result appears anywhere in the corpus."
