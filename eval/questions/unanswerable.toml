language = "pl"
kind = "unanswerable"
difficulty = "easy"
relevant_documents = []
reference_answer = "Korpus nie zawiera odpowiedzi. Żaden z dokumentów nie dotyczy rozmieszczania czujników ani monitoringu jakości powietrza — kryteria istotności i nadmiarowości są w nich stosowane wyłącznie do wyboru cech (zmiennych, genów, kolumn danych) do klasyfikacji lub prognozowania. Poprawny system powinien powiedzieć, że nie znalazł w korpusie żadnego fragmentu o doborze lokalizacji czujników ani o sieciach pomiarowych."
notes = "out-of-scope (pl), phrased in corpus vocabulary. Confirmed by grep -Fil across all 17 files: 'sensor' = 0 files, 'czujnik' = 0, 'wireless' = 0, 'sensor placement' = 0, 'air quality' = 0, 'jakości powietrza' = 0. The nearest domain match is Bouzgou & Gueymard's solar irradiance data from 20 measurement sites, but that paper selects lagged time-series variables, never site or instrument locations — I checked its variable-selection scenarios (long window, short window, PCA, clear-sky) and none is spatial."

[[question]]
id = "unanswerable-004"
text = "In Ding and Peng's microarray study, how much did the leave-one-out error drop when random forest classifiers were used on the MRMR-selected genes compared with the baseline gene set?"
language = "en"
kind = "unanswerable"
difficulty = "medium"
relevant_documents = []
reference_answer = "The question rests on a false premise and the corpus cannot answer it. Ding and Peng evaluate MRMR gene sets with four classification methods — Naive Bayes, linear discriminant analysis, logistic regression and support vector machines — and report no random-forest results at all; a correct system should say it found no random-forest experiment in that paper rather than supplying a number."
notes = "false-premise. Confirmed by grep -Fic 'random forest' on ding-i-peng-2005-*.txt = 0 hits. The paper's own abstract enumerates its classifiers: 'Improvements are observed consistently among 4 classification methods: Naive Bayes, Linear discriminant analysis, Logistic regression, and Support vector machines.' Random forests do appear elsewhere in the corpus (Zhao et al. at Uber, Xie et al.'s classifier), which makes this a realistic trap — a retriever will surface random-forest passages from the wrong papers, and the system must not transplant those numbers onto Ding and Peng."

[[question]]
id = "unanswerable-005"
text = "Which paper proves that the greedy incremental mRMR search is submodular and therefore within a (1 - 1/e) factor of the optimal feature subset, and what is the proof sketch?"
language = "en"
kind = "unanswerable"
difficulty = "hard"
relevant_documents = []
reference_answer = "No such proof exists in the corpus. The papers present the incremental/forward search as a heuristic that avoids the intractable exhaustive combinatorial search, but none of them establishes submodularity or any (1 - 1/e) approximation guarantee; a correct system should state that it found no submodularity argument or approximation bound for the greedy mRMR search anywhere in these documents."
notes = "false-premise. Confirmed by grep -Fil across all 17 files: 'submodular' = 0 files, 'approximation guarantee' = 0, 'NP-hard' = 0. Ding & Peng and Zhao et al. do justify the greedy search by the cost of exhaustive search (Zhao's abstract calls optimal subset selection an NP-complete problem, hyphenated across a line break), but justifying a heuristic is not proving a bound — I read Ding & Peng's incremental-search section and Zhao's method section and neither states any optimality ratio."

