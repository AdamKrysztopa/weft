[[question]]
id = "unanswerable-010"
text = "Several of these papers select genes from expression data for classification. How is the mRMR relevance term adapted when the outcome is a censored survival time rather than a class label — for example, using a Cox proportional-hazards score in place of an F-statistic or mutual information?"
language = "en"
kind = "unanswerable"
difficulty = "medium"
relevant_documents = []
reference_answer = "This corpus does not answer the question. None of the ten papers treats a censored, time-to-event outcome: the targets handled are class labels (binary and multi-class classification) and, in a few papers, continuous regression targets. No document defines a relevance measure for censored data, and none mentions survival analysis, censoring, or Cox proportional hazards. A correct system should say it found no discussion of survival outcomes in these documents, name the outcome types that are covered instead, and refuse to extrapolate from the classification and regression relevance measures the papers do describe (F-statistic, mutual information, HSIC, correlation)."
notes = "Category: adjacent-but-absent — survival-outcome gene selection sits one step from the microarray classification these papers do. Absence confirmed by case-insensitive whole-corpus search of every .txt in the extraction directory for 'survival', 'censor', 'time-to-event' and 'hazard': zero hits in any file. 'Cox' occurs only twice in the whole directory and both are author surnames in reference lists ('Z. Zhao, J. Cox, D. Duling...' in ax-2208.09901v2, 'Cox DR, Analysis of Binary Data' in the non-tier Ding & Peng file), never the proportional-hazards model."

[[question]]
id = "unanswerable-011"
text = "Do any of these methods offer a privacy-preserving or differentially private version of mRMR, for the case where the gene expression or customer data cannot leave the institution that holds it?"
language = "en"
kind = "unanswerable"
difficulty = "easy"
relevant_documents = []
reference_answer = "The corpus contains nothing on this. No paper here discusses privacy, differential privacy, encryption, anonymisation, or federated computation of the relevance and redundancy terms. The distributed papers in the collection (the map-reduce N3LARS work and the Spark-based vertical-partitioning mRMR work) motivate their designs by scalability and fault tolerance on commodity clusters, not by keeping data in place for privacy reasons. A correct system should state that no document in this collection addresses privacy-preserving feature selection, rather than inventing a privatised variant of the mRMR criterion."
notes = "Category: adjacent-but-absent — a natural next question for anyone applying these gene-expression and customer-propensity methods. Absence confirmed by case-insensitive whole-directory search for 'privacy', 'differential privacy', 'confidential', 'secure', 'encrypt', 'GDPR', 'de-identif' and 'federated': zero hits in every file. 'anonym' matches only once (ax-1908.05376v1, 'anonymous reviewers' in the acknowledgements), which is not about data privacy."

[[question]]
id = "unanswerable-012"
text = "When the goal is to pick a maximally relevant, minimally redundant subset of training samples rather than of features — instance selection — which criterion do these papers recommend, and how do they measure the redundancy between two samples?"
language = "en"
kind = "unanswerable"
difficulty = "medium"
relevant_documents = []
reference_answer = "The question is outside what this corpus covers. Every method here applies relevance and redundancy to features: relevance is measured between a candidate feature and the target, and redundancy between pairs of features. No paper in the collection applies the mRMR criterion to selecting rows, training examples, prototypes or instances, and none defines a redundancy measure between two samples. A correct system should say that it found only feature-level relevance and redundancy in these documents and that instance or sample selection is not addressed, instead of transferring the feature-level formulas to samples on its own authority."
notes = "Category: out-of-scope phrased in the corpus's own vocabulary (relevance, redundancy, mRMR) — the words match the corpus exactly, the task does not. Absence confirmed by case-insensitive whole-directory search for 'instance selection', 'sample selection', 'prototype', 'select samples', 'selecting samples', 'sample subset', 'row selection' and 'subsampling': zero hits in every file."

