[[question]]
id = "unanswerable-014"
text = "On the shared gene expression benchmarks, which achieved the lower false discovery rate — SmRMR (Naylor et al.) or the Boruta–mRMR hybrid of BoMGene?"
language = "en"
kind = "unanswerable"
difficulty = "hard"
relevant_documents = []
reference_answer = "No such comparison exists in this corpus. The SmRMR paper does report false-discovery-rate control for its own procedure, but it never evaluates BoMGene or Boruta and does not cite that work. The BoMGene paper never reports a false discovery rate at all and does not mention SmRMR. The two papers share no common benchmark comparison, so no answer to 'which was lower' can be grounded here. A correct system should say that the two methods were never compared head to head in these documents and that BoMGene reports no FDR figure, instead of pairing numbers taken from two separate papers."
notes = "Category: false-premise — it presupposes a head-to-head comparison that does not exist. Confirmed: case-insensitive whole-directory search for 'Boruta' returns hits only in ax-2510.00907v1 (BoMGene); 'Naylor' returns hits only in ax-2508.18901v1 (SmRMR's own author list), so neither cites the other. 'false discovery' and 'FDR' occur only in ax-2508.18901v1 (41 'FDR' hits) and never in ax-2510.00907v1. Deliberate trap worth noting: the literal string 'SmRMR' does occur 6 times in ax-2510.00907v1, but every occurrence is the BoMGene pseudocode's notation for the mRMR-selected feature set (e.g. 'SmRMR ← SmRMR ∪ {j}'), not a reference to the SmRMR method — a retriever that matches on the token alone will surface a false positive."

[[question]]
id = "unanswerable-015"
text = "In the transient stability assessment study on the New England 39-bus system, how did the improved mRMR criterion compare with the Boruta wrapper — which selected fewer features, and which gave the higher classification accuracy?"
language = "en"
kind = "unanswerable"
difficulty = "hard"
relevant_documents = []
reference_answer = "The question rests on a comparison that this corpus does not contain. The transient stability paper does evaluate its improved mRMR criterion on the New England 39-bus case, but Boruta appears nowhere in that paper; the comparisons it reports are against the standard mRMR criterion, the full original feature set, and PCA-based reduction. Boruta appears in only one document in the whole collection — the BoMGene gene expression paper — which involves no power-system data and no 39-bus case. A correct system should point out that no Boruta comparison exists in the transient stability work and name the baselines that paper actually uses, rather than fabricating feature counts or accuracies for a Boruta run."
notes = "Category: false-premise (it presupposes a comparison that was never made), anchored in a setting that genuinely exists so the retriever will find the right document. Confirmed: 'New England' and '39-bus' occur only in ax-1903.01907v1, and 'Boruta' occurs only in ax-2510.00907v1 — the two never co-occur in any file. 'PCA' occurs 5 times in ax-1903.01907v1, so the baselines named in the reference answer are the ones that paper does report."

[[question]]
