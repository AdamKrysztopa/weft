# V2 question set (`docs/09-release.md` §4.3) — the unanswerable round: questions this corpus
# does not answer, which V2 asks for by name — "a RAG engine that cannot say 'not in this
# corpus' is untested for its most damaging failure". `notes` records what was searched for and
# not found, because that is the whole evidence an absence can have.
#
# `eval/check_questions.py` owns the schema, every rule these entries are refused by, and
# the argument for why nothing written here may be believed until
# `tests/docs/test_question_set.py` has read it back out of the corpus. This file holds
# questions and no design.
#
# **Provenance, which V2 requires recorded per answer.** Each question was written by an LLM
# agent (Claude Opus 5, 2026-08-17) that had read the document it names, from the passage
# quoted beside it, and was checked by a second, independent agent; `notes` carries the
# per-question detail. This is not human-expert ground truth and must not be reported as
# though it were — those agents verified their own quotes, and a mechanical re-check still
# rejected 4 of 287 as appearing nowhere in the file they named.

[[question]]
id = "unanswerable-001"
text = "Jak dropout i wczesne zatrzymywanie uczenia (early stopping) chronią sieć neuronową przed nadmiernym dopasowaniem, i jaką wartość współczynnika dropout zaleca się w praktyce?"
language = "pl"
kind = "unanswerable"
difficulty = "medium"
relevant_documents = []
reference_answer = "Korpus nie zawiera odpowiedzi. Ani artykuł o nadmiernym dopasowaniu, ani żaden inny dokument nie wspomina o dropoucie ani o wczesnym zatrzymywaniu uczenia — wymienione są wyłącznie inne środki zapobiegawcze (zbiory walidacyjne, sprawdzian krzyżowy, metody samowsporne, testy istotności statystycznej). Poprawny system powinien powiedzieć, że nie znalazł w korpusie żadnego fragmentu o dropoucie, wczesnym zatrzymywaniu ani o doborze współczynnika dropout."
notes = "adjacent-but-absent (pl). Confirmed by grep -Fic across all 17 files: 'dropout' = 0, 'early stopping' = 0, 'wczesne zatrzym' = 0, 'regularyzac' = 0 in every pl-*.txt. I read pl-nadmierne-dopasowanie.txt in full: its prevention list is 'zbiorów walidacyjnych, sprawdzianu krzyżowego, metod samowspornych' plus 'testy istotności statystycznej' — no regularisation and no dropout. The only corpus-wide 'regulariz' hits are lopez-paz and radovic (L2,1-norm group lasso inside the MT-LASSO baseline description), which say nothing about neural-network overfitting remedies."

[[question]]
id = "unanswerable-002"
text = "How is the maximum-relevance minimum-redundancy idea applied to diversifying search-engine result lists, i.e. how are redundant documents demoted in a ranking while relevance to the query is preserved?"
language = "en"
kind = "unanswerable"
difficulty = "easy"
relevant_documents = []
reference_answer = "The corpus does not answer this. All eight papers apply relevance/redundancy criteria to selecting features (variables, genes, columns) for classification or forecasting, never to ranking or diversifying retrieved documents; a correct system should state that it found no passage on information retrieval, document ranking, query result diversification, or maximal marginal relevance."
notes = "out-of-scope, phrased in the corpus's own relevance/redundancy vocabulary. Confirmed by grep -Fil across all 17 files: 'information retrieval' = 0 files, 'maximal marginal' = 0, 'document ranking' = 0, 'diversif' = 0, 'search engine' = 0. The two files matching 'query' are radovic (line 942, a bibliography entry 'Speech Audio Retrieval Using Voice Query') and ramirez-gallego (line 268, Spark loading data into memory and querying it repeatedly) — both database/citation contexts, neither about ranking documents."

