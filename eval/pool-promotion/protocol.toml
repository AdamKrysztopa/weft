# Phase 40's protocol, written before any run it governs (ledger 40.0). Every number here that needs
# no data is fixed now; the power numbers are 40.6's, from 40.4's baseline and 40.5's labels, and
# are committed into [power] when they exist. Nothing below is tuned on an evaluation outcome.
# tests/docs/test_pool_promotion_protocol.py holds it.

[scope]
label = "exploratory on reused benchmarks"
# Phase 39 fitted weights on these questions' train split and read the held-out split, and those
# outcomes motivated this phase — so nothing measured on them is confirmatory.
keep_original_split = true
tuning_forbidden = ["entities", "matcher", "pool_depth", "slice_criteria"]

[[corpus]]
name = "esci"
role = "primary"
questions = "corpus/esci-questions.toml"
question_count = 830

[[corpus]]
name = "techqa"
role = "confirmatory"
questions = "corpus/techqa-questions.toml"
question_count = 610

[pool]
retriever = "vector-top-k"
depth = 50
unit = "chunks"
# One pool for the gate and every arm in Phases 40 and 41, frozen once by 40.2's capture. Documents
# are what the evaluator collapses to after reordering; distinct documents per question are recorded.

[metrics]
primary = "mrr@5"
secondary = ["recall@1", "ndcg@10"]
# All three read off one ranking per question (40.1).

[anchors]
extractor = "find_anchors"
entities = []

[labelling]
# 40.5. Oracle anchors from the question text alone; an empty set recorded explicitly.
oracle_population = "rule fires, or the stored anchored axis is true"
identifier_exact = "shown the question, its whole relevant set shuffled and the pool's same-family documents, a labeller records whether an identifier in the question decides relevant from sibling"
sibling_rule = "same product and problem, another version, CVE or error code"
second_labeller_per_corpus = 30
adjudicator = "owner"

[effect]
worthwhile = 0.05
alpha = 0.05
power = 0.80
# n ~= (2.8 * sd / worthwhile)^2. The sd bound per contrast:
reorderer_vs_dense_sd_bound = "sqrt(mean(max(RR@5_i, oracle_gain_i)^2))"
reorderer_vs_reorderer_sd_bound = "sqrt(mean(p_i)), p_i = 1[any relevant in pool]"
reorderer_vs_reorderer_reading = "descriptive"

[ceilings]
oracle_gain = "1[any relevant document has a chunk in the pool] - RR@5(dense)"
promotion_gain = "1[rule fires and some pool chunk of a relevant document contains an anchor] * (1 - RR@5(dense))"
denominator = "every question in the corpus"
open_phase_41_when = "esci oracle ceiling >= 0.05"

# The verdict per contrast, on the paired 95% interval [L, U] and point estimate d.
# Exhaustive, first match wins.
[[verdict]]
name = "harm"
when = "U < 0"

[[verdict]]
name = "benefit ruled out"
when = "U < worthwhile"

[[verdict]]
name = "worthwhile"
when = "L > 0 and d >= worthwhile"

[[verdict]]
name = "positive, below worthwhile"
when = "L > 0"

[[verdict]]
name = "inconclusive"
when = "otherwise"
underpowered_when = "n below 40.6's requirement"

[joint_reading]
# Rule and oracle arms are read together, on identical question ids.
extractor_condemned = "rule arm not worthwhile beside an oracle arm worthwhile or positive"
promotion_ruled_out = "oracle arm is harm or benefit ruled out, on that slice only"
reach = "anchor-promote's policy, its extractor and the population measured, nothing wider"

[runs]
# L24.9: an arm that reaches no model runs once.
repeats_without_model = 1
spend_cap_usd = 5.0
pricing = "tokenized, never characters / 4"

[power]
# 40.6's numbers are `{corpus}-power.json`, computed by scripts/pool_power.py at moved_fraction 1.

# ---------------------------------------------------------------------------------------------------
# Phase 41 (ledger 41.0), written before any cross-encoder score exists. Same pools, questions,
# metrics, slices and verdict as Phase 40; what follows is only what a cross-encoder adds.

[phase_41]
label = "exploratory on reused benchmarks"
adoption_model = "BAAI/bge-reranker-v2-m3"
exploratory_models = ["cross-encoder/ms-marco-MiniLM-L6-v2"]
# Nothing measured here moves a default. Adoption is Phase 41b's, on untouched data (G26).
tuning_forbidden = ["model", "depth", "truncation", "pool_depth", "slices"]
depth = 50
truncate = true
truncation_direction = "Right"
raw_scores = false

[[phase_41.arm]]
name = "dense"
reorderer = "none (40.8's identity replay, reused, not re-run)"

[[phase_41.arm]]
name = "anchor-promote"
reorderer = "anchor-promote (40.8's record, reused, not re-run)"

[[phase_41.arm]]
name = "cross-encoder-bge"
reorderer = "cross-encoder-rerank, model BAAI/bge-reranker-v2-m3"

[[phase_41.arm]]
name = "cross-encoder-minilm"
reorderer = "cross-encoder-rerank, model cross-encoder/ms-marco-MiniLM-L6-v2"

[[phase_41.contrast]]
arms = ["cross-encoder-bge", "dense"]
reading = "verdict"

[[phase_41.contrast]]
arms = ["cross-encoder-minilm", "dense"]
reading = "verdict"

[[phase_41.contrast]]
arms = ["cross-encoder-bge", "anchor-promote"]
reading = "descriptive"

[[phase_41.contrast]]
arms = ["cross-encoder-minilm", "anchor-promote"]
reading = "descriptive"

[phase_41.power]
# L27.2: 40.6's bound assumed every question moves by its whole headroom, and 40.8's realised
# intervals came back 4-13x narrower than the MDE it implied wherever the rule moved anything.
# A cross-encoder rescores every pair, so it can move any question with a relevant chunk in the pool; the bound assumes half of them
# move by their whole headroom, the rest not at all: sd bound x sqrt(moved_fraction).
moved_fraction = 0.5
# Printed beside every slice: the largest fraction at which the slice would be powered
# (n / n_required at fraction 1), and 40.8's realised mrr@5 half-width for the rule arm.
breakeven_fraction = "n / n_required(moved_fraction = 1)"
realised_beside = "40.8 anchor-promote mrr@5 half-width"

[phase_41.repeats]
# L24.9: an arm that reaches a model runs twice. The verdict is read on the first repetition; the
# second is compared question by question, differing questions counted beside it, and a slice
# whose two verdicts differ reads "unstable" rather than either verdict.
per_model_arm = 2
read_on = 1

[phase_41.open_41b]
when = "cross-encoder-bge against dense, esci, slice all, verdict is neither harm nor benefit ruled out"

[phase_41.instrument]
# Four experiments in a row have been null. If cross-encoder-bge against dense on esci, slice all,
# reads harm or benefit ruled out, the instrument is checked before the technique is judged, and
# the report says which checks ran and what they found:
checks = [
  "a gold-first replay of the same pool realises dense mrr@5 + the oracle ceiling exactly",
  "cross-encoder scores for 20 questions recomputed by a direct /rerank call reproduce the replay's order",
  "the replay's (-score, rank) key reproduces the emitted order through repack's reverse",
]

[phase_41.spend]
cap_usd = 5.0
order = ["41.3 (local, $0)", "41.4 llm-rerank pilot", "41.4 repetition 1", "41.4 repetition 2"]
# 41.4 only: before each paid run, spend recorded so far plus that run's tokenized worst-case bound
# must be <= cap_usd, or the run does not start and the stop is recorded.
llm_rerank_corpora = ["esci"]
