# Widening each hit with its neighbouring chunks against plain retrieval, token recall of the generated answer on the operator-en questions.

[claim]
schema = 2
id = "adjacent-chunks-then-generate.operator-en.token-recall"
rung = "adjacent-chunks-then-generate"
baseline = "retrieve-then-generate"
metric = "token_recall"
status = "helps"
verdict = "positive-below-margin"
basis = "records"
margin = 0.05

[claim.population]
benchmark = "validation-en"
language = "en"
question_sets = ["eval/questions/operator.toml"]

[claim.source]
experiment = "eval/experiments/context-construction-en-operator-widen.toml"
invocation = "301036c84ba945858ab8f032cef0693b"

[claim.untested]
regimes = [
  "language other than en",
  "corpora other than the 16-paper validation-en corpus",
  "a question mix other than the one question set measured",
]
