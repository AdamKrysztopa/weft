# RAPTOR-and-leaves fusion (layer enrich-with-raptor-corpus, a corpus-scoped tree) against one search, on 80 corpus-wide questions.

[claim]
schema = 1
id = "raptor-and-leaves-rrf.global.answer-correctness"
rung = "raptor-and-leaves-rrf"
baseline = "retrieve-then-generate"
metric = "answer_correctness"
status = "helps"
basis = "records"
margin = 0.05

[claim.population]
benchmark = "validation-en"
language = "en"
question_sets = ["eval/global-questions/train.toml", "eval/global-questions/held-out.toml"]

[claim.source]
experiment = "eval/experiments/global-synthesis-raptor.toml"
invocation = "8a4594b3f6ec480198cd1c15b4c79b40"

[claim.untested]
regimes = [
  "corpora other than the 16-paper validation-en corpus (253,408 leaf tokens)",
  "language other than en",
  "multi-hop questions, which graph retrieval was built for",
]
