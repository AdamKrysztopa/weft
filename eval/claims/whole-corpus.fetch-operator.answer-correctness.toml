# Whole-corpus reading against one search, on the 107 English questions (fetch + operator) over the
# 16-paper `validation-en` corpus, which counts 253,408 tokens. The regime is the size measured:
# the two smaller subsets (23 and 50 questions) were inconclusive, so the claim starts above them.

[claim]
schema = 2
id = "whole-corpus.fetch-operator.answer-correctness"
rung = "whole-corpus-wide-then-generate"
baseline = "retrieve-then-generate"
metric = "answer_correctness"
status = "helps"
verdict = "worthwhile"
basis = "records"
margin = 0.05

[claim.regime]
when = [
  { feature = "corpus.base_complete", op = "eq", value = true },
  { feature = "corpus.fits_context", op = "eq", value = true },
  { feature = "corpus.leaf_tokens", op = "gte", value = 200000 },
  { feature = "corpus.leaf_tokens", op = "lte", value = 260000 },
]

[claim.population]
benchmark = "validation-en"
language = "en"
question_sets = ["eval/questions/fetch.toml", "eval/questions/operator.toml"]

[claim.source]
experiment = "eval/experiments/whole-corpus-en.toml"
invocation = "77a0ab088ccd43688bc0403932c95e6b"

[claim.untested]
regimes = [
  "corpus.leaf_tokens < 200000 (inconclusive at 23 and 50 questions: whole-corpus-size-25, -50)",
  "corpus.leaf_tokens > 260000 (above the 100,000-token default bound and the price step at 272K)",
  "language = pl (12 questions, no difference: whole-corpus-pl)",
]

[claim.fingerprint]
rung = "9d0a2906aa3dd38a0d6c79694c7a90cc"
baseline = "e9eeb3e1cf0e411fb0b14712d10d2059"
index = "3d94928db46b2a4dd36ca9406a32e1af"
baseline_index = "3d94928db46b2a4dd36ca9406a32e1af"
judge = "ee0647c30769bd5855ef9396a004af76b3111fde9472c81f1df34a175d35df23"
profiler = "1"
