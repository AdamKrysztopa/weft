# Graph retrieval at the Phase 11 exit: measured on 12 one-sentence documents with questions generated from the graph under test, so the questions do not test it (ledger only). Not recomputable.

[claim]
schema = 2
id = "index-with-facts.graph-fixture.recall-at-5"
rung = "index-with-facts"
baseline = "retrieve-then-generate"
metric = "recall@5"
status = "wrong-questions"
basis = "ledger"
ledger = "Phase 11 exit (ledger only)"

[claim.population]
benchmark = "Phase 11 exit fixture (12 one-sentence documents)"
language = "en"
question_sets = []

[claim.untested]
regimes = [
  "any corpus larger than 12 one-sentence documents",
  "questions not generated from the graph under test",
  "multi-hop questions on MuSiQue (see the multi-hop row of the evidence page)",
]
