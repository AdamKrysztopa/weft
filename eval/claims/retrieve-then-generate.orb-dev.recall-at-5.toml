# Dense first stage against the lexical first stage on Open RAGBench's dev questions.

[claim]
schema = 1
id = "retrieve-then-generate.orb-dev.recall-at-5"
rung = "retrieve-then-generate"
baseline = "lexical-retrieve"
arm = "dense"
baseline_arm = "lexical"
metric = "recall@5"
status = "helps"
basis = "records"
margin = 0.05

[claim.population]
benchmark = "open-ragbench"
language = "en"
question_sets = ["corpus/open-ragbench-questions/dev.toml"]

[claim.source]
experiment = "eval/experiments/orb-retrieval-baseline.toml"
invocation = "7017a15bea924619a66024d24b532b7d"

[claim.untested]
regimes = [
  "language other than en",
  "corpora other than open-ragbench (1,548 questions, three repetitions)",
]
