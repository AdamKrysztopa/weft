# Forty questions — the gate of ledger task 39.1, written 2026-09-18 after the camelCase clause was
# narrowed at 9aaa376, by an agent that saw G24's definition of an anchor and neither the code nor
# the first forty. Twenty carry anchors (g01–g20), twenty none (m01–m20); 11 of the none carry
# digits as quantities and 8 carry mixed-case names. The rule failed this set once, as written
# (precision 0.800, recall 0.923). Four questions (g03, g07, g08, g20) then had the writer's own
# shape vocabulary — "snake_case", "camelCase", "SCREAMING_SNAKE", which the brief's wording induced
# and no user types — removed from their text, labels unchanged, before any model was run on them.
# Then peer-reviewed by Codex (gpt-6-astra) against the definition alone: 76 of 80 labels accepted,
# none clearly wrong, four ambiguous where the definition was silent. The definition was sharpened
# (a header named as one is an anchor; an acronym with a digit is; a hex value is only when it is
# a code), m14 gained `2FA` and g20 lost `0xFF00`, and g04, g07, g08 and g20 — judged constructed
# token exercises — were rewritten as natural questions by a fresh agent blind to the code.

