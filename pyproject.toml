[tool.uv.workspace]
members = ["packages/*", "testing/*"]

[dependency-groups]
dev = [
    "poethepoet>=0.30",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    # >=0.16.0: the first release that formats Python code blocks fenced in Markdown by
    # default (changelog: "Ruff can now format Python code blocks in Markdown files and
    # will do this by default"). `weft_cli.contract_reference` pipes its generated
    # Markdown through `ruff format` and relies on exactly that behaviour to match what
    # `poe ci-checks`' own `fmt` step does to the checked-in file — an in-range resolution
    # below 0.16 would leave a long signature unwrapped instead.
    "ruff>=0.16.0",
    # Test-only, task 4.5. `weft-kernel` ships `opentelemetry-api` alone (fitness function 1);
    # at 4.5 no shipped distribution declared the SDK at all, which is why this copy exists —
    # see `tests/unit/weft_kernel/test_seam_trace_visibility.py`'s own docstring for the
    # argument in full. Task 5.1d's `weft-otel` is now the first shipped distribution to
    # declare `opentelemetry-sdk` for real (its own `pyproject.toml`), which makes this
    # workspace-root copy redundant for that one package but not for anything else that
    # imports the SDK in a test without pulling in the rest of `weft-otel` — left in place
    # rather than pruned on a guess about which future test would need it back.
    "opentelemetry-sdk>=1.28",
]

# The dev environment's alignment with `compose.yaml`, and nothing a downstream install
# ever sees. `qdrant-client` warns when it is more than one minor version ahead of the
# server it is talking to, and `compose.yaml` pins `qdrant/qdrant:v1.12.4` — so without
# this, every conformance run against the checked-in container would emit a warning about
# the container rather than about anything Weft did. A constraint applies to *this
# workspace's* resolution only; `packages/weft-qdrant` declares no ceiling, because the
# version an operator's own deployment supports is theirs to decide, not this repository's.
# Raise this and the image together, in one commit, or the pair stops meaning anything.
[tool.uv]
constraint-dependencies = ["qdrant-client<1.14"]

# Six published distributions, and the workspace resolves every one of them from this
# checkout rather than from an index. Fourteen names left this list on 2026-09-05: their code
# ships inside `weft-rag` now (`packages/weft-rag/pyproject.toml` carries the argument), so
# there is nothing left for `uv` to resolve under those names.
[tool.uv.sources]
weft-kernel = { workspace = true }
weft-rag = { workspace = true }
weft-pdf = { workspace = true }
weft-openai = { workspace = true }
weft-qdrant = { workspace = true }
weft-otel = { workspace = true }

# ---------------------------------------------------------------------------
# Tasks
#
# Fitness function 0 — "the gate must be in the gate" — asserts that every
# architecture check below is reachable from `ci-checks`. The composite is
# therefore load-bearing, not a convenience: see docs/01-high-level-plan.md.
# ---------------------------------------------------------------------------
[tool.poe.tasks]
fmt = "ruff format ."
lint = "ruff check ."
types = "pyright"
arch = "pytest tests/architecture -q"
test = "pytest tests -q"

[tool.poe.tasks.ci-no-tests]
sequence = ["fmt", "lint", "types", "arch"]
help = "Fast baseline: format, lint, types, architecture. No unit tests."

# Ledger task 6.23. The seven out-of-tree example packs ship 116 tests between them and
# `testpaths = ["tests"]` meant the gate had never run one — `docs/lessons.md` L6.12: a directory
# of tests no task runs is prose, exactly as a documented check no task runs is prose, one level
# up from the check to the suite. Two of `weft-example-graph`'s were quietly red when somebody
# finally looked.
#
# **A task of its own rather than a widened `testpaths`, for two reasons.** An example pack is
# deliberately not a workspace member (fitness function 9(a)), so nothing installs it and its own
# `src/` has to reach `sys.path` explicitly — the same gap `[tool.pyright] extraPaths` already
# closes for type checking. And several packs name a test file the same thing (`test_store.py`,
# `test_retriever.py`), which pytest's default import mode refuses; `--import-mode=importlib`
# accepts it without renaming 28 files that belong to strangers.
[tool.poe.tasks.examples-tests]
help = "Task 6.23: the out-of-tree example packs' own suites, which the gate reaches."
cmd = "pytest examples -q --import-mode=importlib"

[tool.poe.tasks.examples-tests.env]
PYTHONPATH = "examples/weft-example-chunker/src:examples/weft-example-command/src:examples/weft-example-graph/src:examples/weft-example-ingest/src:examples/weft-example-llm/src:examples/weft-example-metric/src:examples/weft-example-query/src"

[tool.poe.tasks.ci-checks]
sequence = ["fmt", "lint", "types", "arch", "test", "examples-tests"]
help = "The canonical full gate. Every architecture check must be reachable from here."

[tool.poe.tasks.kernel-isolated]
help = "Fitness function 1, primary half: install weft-kernel alone and import it."
cmd = "python scripts/check_kernel_isolated.py"

[tool.poe.tasks.isolated-installs]
help = "Task 6.6: install every published distribution alone in a clean env and import it."
cmd = "python scripts/check_isolated_installs.py"

[tool.poe.tasks.sdists]
help = "Task 6.7: every sdist carries what the checkout has, and the suite passes from them."
cmd = "python scripts/check_sdists.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "testing/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "S", "PTH", "RET", "SIM", "TID"]
ignore = ["S101"]  # assert is the point in tests

[tool.ruff.lint.per-file-ignores]
# `.claude/hooks/` is not project Python. These files are launched by the Claude Code harness
# as bare `python3`, which is 3.9 on the development machine — not the 3.12 the packages are
# built against and not the `.venv` interpreter. `target-version = "py312"` above is therefore
# wrong for this one directory, and not harmlessly so: before this entry existed, ruff's `UP017`
# *demanded* `datetime.UTC` in `.claude/hooks/subagent_findings.py`, which is 3.11+ and crashed
# the hook on import. A hook that fails to import is silently a hook that does not exist, so the
# gate was not merely blind to the defect — it required it (`docs/lessons.md` L6.6).
# `UP` alone is suppressed: every other rule selected above is version-independent and these
# files are worth linting, which is why the directory is not excluded outright.
".claude/hooks/*" = ["UP"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# `examples` joined this list at task 2.11 (`docs/07-extension-cost.md` §9): the out-of-tree
# example packs FF9(c) requires are neither workspace members nor `uv.lock`-resolved, so
# they were previously untyped by this gate entirely — a real gap in existing tooling,
# closed here rather than left implicit.
include = ["packages", "testing", "tests", "scripts", "eval", "examples"]
# Every first-party `src/` layout resolves because `uv sync` installs it editable into
# `.venv` — an out-of-tree example pack is deliberately *not* a workspace member (fitness
# function 9(a)), so nothing installs it there, and a test importing its own pack by name
# from outside `src/` has nothing to resolve against without its own path listed here.
extraPaths = [
    "scripts",
    "eval",
    "examples/weft-example-chunker/src",
    "examples/weft-example-command/src",
    "examples/weft-example-ingest/src",
    "examples/weft-example-llm/src",
    "examples/weft-example-query/src",
    "examples/weft-example-metric/src",
    # weft-example-graph (task 5.4): the graph add-on docs/02-extension-model.md section 4
    # specifies, built by a pack author who never touched packages/ — same reason as every
    # entry above. Named `weft-example-*` like every other example pack, and deliberately not
    # `weft-graph`: that is the name the design documents use for this pack as a *hypothetical*,
    # quoted verbatim in several first-party docstrings, so a real pack taking it turns every
    # legitimate quotation into a fitness-function-9(b) violation (docs/lessons.md L5.28).
    "examples/weft-example-graph/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
# `scripts/` is not a distribution and must not become one — it holds hand-run operator tools, and
# `docs/09-release.md` §4's prerequisites are artefacts, not a subsystem. But a test that re-read
# the corpus manifest itself would be a second manifest reader, drifting from the one an operator
# actually runs. So the script is imported, not reimplemented, and this is the one line that makes
# that possible. Paired with `[tool.pyright] extraPaths` below, which resolves the same import.
pythonpath = ["scripts", "eval"]

# A hang must fail, not stall. The registration seam guards blocking calls by
# overriding socket and SSL operations, so a regression there does not raise —
# the test simply never returns, and a stalled gate reads as "CI is stuck"
# rather than "the seam is broken". Generous on purpose: this is a deadlock
# detector, not a performance budget, and Phase 0 step 8 brings a container.
timeout = 60
