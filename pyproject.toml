[tool.uv.workspace]
members = ["packages/*", "testing/*"]

[dependency-groups]
dev = [
    "poethepoet>=0.30",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    # >=0.16.0: the first release that formats Python code blocks fenced in Markdown by
    # default (changelog: "Ruff can now format Python code blocks in Markdown files and
    # will do this by default"). `weft_cli.contract_reference` pipes its generated
    # Markdown through `ruff format` and relies on exactly that behaviour to match what
    # `poe ci-checks`' own `fmt` step does to the checked-in file — an in-range resolution
    # below 0.16 would leave a long signature unwrapped instead.
    "ruff>=0.16.0",
]

# The dev environment's alignment with `compose.yaml`, and nothing a downstream install
# ever sees. `qdrant-client` warns when it is more than one minor version ahead of the
# server it is talking to, and `compose.yaml` pins `qdrant/qdrant:v1.12.4` — so without
# this, every conformance run against the checked-in container would emit a warning about
# the container rather than about anything Weft did. A constraint applies to *this
# workspace's* resolution only; `packages/weft-qdrant` declares no ceiling, because the
# version an operator's own deployment supports is theirs to decide, not this repository's.
# Raise this and the image together, in one commit, or the pair stops meaning anything.
[tool.uv]
constraint-dependencies = ["qdrant-client<1.14"]

[tool.uv.sources]
weft-kernel = { workspace = true }
weft-cli = { workspace = true }
weft-command = { workspace = true }
weft-extract = { workspace = true }
weft-chunk = { workspace = true }
weft-clean = { workspace = true }
weft-store = { workspace = true }
weft-embed = { workspace = true }
weft-enhance = { workspace = true }
weft-pdf = { workspace = true }
weft-openai = { workspace = true }
weft-llm = { workspace = true }
weft-prompts = { workspace = true }
weft-retrieve = { workspace = true }
weft-generate = { workspace = true }
weft-qdrant = { workspace = true }
weft-index = { workspace = true }

# ---------------------------------------------------------------------------
# Tasks
#
# Fitness function 0 — "the gate must be in the gate" — asserts that every
# architecture check below is reachable from `ci-checks`. The composite is
# therefore load-bearing, not a convenience: see docs/01-high-level-plan.md.
# ---------------------------------------------------------------------------
[tool.poe.tasks]
fmt = "ruff format ."
lint = "ruff check ."
types = "pyright"
arch = "pytest tests/architecture -q"
test = "pytest tests -q"

[tool.poe.tasks.ci-no-tests]
sequence = ["fmt", "lint", "types", "arch"]
help = "Fast baseline: format, lint, types, architecture. No unit tests."

[tool.poe.tasks.ci-checks]
sequence = ["fmt", "lint", "types", "arch", "test"]
help = "The canonical full gate. Every architecture check must be reachable from here."

[tool.poe.tasks.kernel-isolated]
help = "Fitness function 1, primary half: install weft-kernel alone and import it."
cmd = "python scripts/check_kernel_isolated.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "testing/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "S", "PTH", "RET", "SIM", "TID"]
ignore = ["S101"]  # assert is the point in tests

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# `examples` joined this list at task 2.11 (`docs/07-extension-cost.md` §9): the out-of-tree
# example packs FF9(c) requires are neither workspace members nor `uv.lock`-resolved, so
# they were previously untyped by this gate entirely — a real gap in existing tooling,
# closed here rather than left implicit.
include = ["packages", "testing", "tests", "scripts", "eval", "examples"]
# Every first-party `src/` layout resolves because `uv sync` installs it editable into
# `.venv` — an out-of-tree example pack is deliberately *not* a workspace member (fitness
# function 9(a)), so nothing installs it there, and a test importing its own pack by name
# from outside `src/` has nothing to resolve against without its own path listed here.
extraPaths = [
    "scripts",
    "eval",
    "examples/weft-example-chunker/src",
    "examples/weft-example-command/src",
    "examples/weft-example-ingest/src",
    "examples/weft-example-llm/src",
    "examples/weft-example-query/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
# `scripts/` is not a distribution and must not become one — it holds hand-run operator tools, and
# `docs/09-release.md` §4's prerequisites are artefacts, not a subsystem. But a test that re-read
# the corpus manifest itself would be a second manifest reader, drifting from the one an operator
# actually runs. So the script is imported, not reimplemented, and this is the one line that makes
# that possible. Paired with `[tool.pyright] extraPaths` below, which resolves the same import.
pythonpath = ["scripts", "eval"]

# A hang must fail, not stall. The registration seam guards blocking calls by
# overriding socket and SSL operations, so a regression there does not raise —
# the test simply never returns, and a stalled gate reads as "CI is stuck"
# rather than "the seam is broken". Generous on purpose: this is a deadlock
# detector, not a performance budget, and Phase 0 step 8 brings a container.
timeout = 60
