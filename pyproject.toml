[tool.uv.workspace]
members = ["packages/*", "testing/*"]

[dependency-groups]
dev = [
    # **G19, 2026-09-09.** The six add-ons were workspace members until that session, so `uv sync`
    # installed each with its own dependencies. Their code is inside `weft-rag` now and only the
    # outside libraries are optional, so the development environment asks for all of them by name
    # — otherwise every test for `weft_pdf`, `weft_openai`, `weft_qdrant`, `weft_otel` and
    # `weft_docling` would be collecting against a pack that reports `failed`. This costs the
    # environment nothing it was not already carrying, `docling-slim`'s 897 MB included.
    "weft-rag[all]",
    "poethepoet>=0.30",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    # The suite outside `tests/architecture` is ~2,250 tests that share nothing, and it was run
    # in one process. `test` now spreads it across the machine — with one exception the whole
    # arrangement turns on: every test that reaches Postgres or Qdrant carries an `xdist_group`
    # (see `tests/conftest.py`), so `--dist=loadgroup` puts all of them on a single worker and
    # they still run one after another. `docs/internal/lessons-archive.md` `L8.30` and `L6.22` are what
    # two suites sharing the one container cost: a truncated table under a running measurement,
    # and a result about neither half.
    "pytest-xdist>=3.6",
    # >=0.16.0: the first release that formats Python code blocks fenced in Markdown by
    # default (changelog: "Ruff can now format Python code blocks in Markdown files and
    # will do this by default"). `weft_cli.contract_reference` pipes its generated
    # Markdown through `ruff format` and relies on exactly that behaviour to match what
    # `poe ci-checks`' own `fmt` step does to the checked-in file — an in-range resolution
    # below 0.16 would leave a long signature unwrapped instead.
    "ruff>=0.16.0",
    # Test-only, task 4.5. `weft-kernel` ships `opentelemetry-api` alone (fitness function 1);
    # at 4.5 no shipped distribution declared the SDK at all, which is why this copy exists —
    # see `tests/unit/weft_kernel/test_seam_trace_visibility.py`'s own docstring for the
    # argument in full. Task 5.1d's `weft-otel` is now the first shipped distribution to
    # declare `opentelemetry-sdk` for real (its own `pyproject.toml`), which makes this
    # workspace-root copy redundant for that one package but not for anything else that
    # imports the SDK in a test without pulling in the rest of `weft-otel` — left in place
    # rather than pruned on a guess about which future test would need it back.
    "opentelemetry-sdk>=1.28",
]

# The dev environment's alignment with `compose.yaml`, and nothing a downstream install
# ever sees. `qdrant-client` warns when it is more than one minor version ahead of the
# server it is talking to, and `compose.yaml` pins `qdrant/qdrant:v1.12.4` — so without
# this, every conformance run against the checked-in container would emit a warning about
# the container rather than about anything Weft did. A constraint applies to *this
# workspace's* resolution only; `packages/weft-qdrant` declares no ceiling, because the
# version an operator's own deployment supports is theirs to decide, not this repository's.
# Raise this and the image together, in one commit, or the pair stops meaning anything.
[tool.uv]
constraint-dependencies = ["qdrant-client<1.14"]

# **Two distributions, and the workspace resolves both from this checkout rather than from an
# index.** Fourteen names left this list on 2026-09-05 and six more on 2026-09-09 (**G19**): all
# twenty ship inside `weft-rag` now, the last six behind extras, so there is nothing left for
# `uv` to resolve under those names. `packages/weft-rag/pyproject.toml` carries the extras and
# the argument; `05` -> G19 the reasoning; `CLAUDE.md` the rule.
[tool.uv.sources]
weft-kernel = { workspace = true }
weft-rag = { workspace = true }

# ---------------------------------------------------------------------------
# Tasks
#
# Fitness function 0 — "the gate must be in the gate" — asserts that every
# architecture check below is reachable from `ci-checks`. The composite is
# therefore load-bearing, not a convenience: see docs/01-high-level-plan.md.
# ---------------------------------------------------------------------------
[tool.poe.tasks]
fmt = "ruff format ."
lint = "ruff check ."
# `docs/internal/lessons.md` L9.1. Ruff caches a verdict **per file**, keyed on that file's own content —
# but first-party/third-party import classification is a fact about the *tree*, so creating
# `weft_eval/falsify.py` made a cached verdict wrong for a file that never changed, and nothing
# invalidated it. Two real errors sat under a green gate across four runs. `ci-checks` is the
# canonical gate and runs rarely, so it can afford to start cold; `ci-no-tests` is the fast
# baseline and keeps its cache, which is what makes the two tasks mean different things.
cold-lint-cache = "ruff clean"
types = "pyright"
arch = "pytest tests/architecture -q"
# **`tests/architecture` is excluded here because `arch` above already ran it.** `pytest tests`
# collected 2,525 tests and 270 of them were the architecture suite, so every `ci-checks` ran that
# suite twice — 601 seconds of it, paid for a second time to learn nothing new. Fitness function 0
# still sees full coverage: `_covered_roots` reads every pytest step of the gate, `arch` supplies
# `tests/architecture` and this step supplies `tests`, and a new suite added anywhere under
# `tests/` is picked up by this step without an edit.
#
# `--numprocesses=` and `--dist=` rather than `-n auto` / `--dist loadgroup`: fitness function 0's
# `_covered_roots` treats any bare word that is not a flag as a path handed to pytest, so the
# `auto` in `-n auto` would read as a test root. The `=` forms are the same instruction with
# nothing for that walk to misread.
[tool.poe.tasks.test]
cmd = "pytest tests --ignore=tests/architecture -q --numprocesses=auto --dist=loadgroup"

# **No `WEFT_EXPECTED_SKIPS` here, and that is the correction rather than the omission.**
# `docs/internal/lessons.md` `L11.22` bought the check in `tests/conftest.py` that compares a run's skip
# count against a number the operator states. This task set that number to **9** — and 9 was a
# fact about the machine it was measured on, which had Qdrant running. CI, whose `compose.yaml`
# counterpart keeps Qdrant behind a `conformance` profile that `docker compose up -d` does not
# start, produced **48** and went red on the first push. The same tree with Qdrant unreachable
# locally produces **44**, so the two environments differ in more than one way: optional extras
# are installed here and not there.
#
# **A skip count is a fact about an environment, so it belongs where the environment is
# declared.** `.github/workflows/ci.yml` names every service and every install step its run gets,
# and states its own expected count beside them. A developer's laptop declares nothing — whatever
# happens to be listening is the environment, which is exactly what `L11.21` says cannot be
# assumed — so a default pinned here would be red for whoever's machine differs from the author's,
# which is the guard people learn to route around.
#
# Local runs therefore make no claim and nothing fires; the container-claim half of the guard
# still speaks whenever `WEFT_DATABASE_URL` or `WEFT_QDRANT_URL` is set and its service is down.
#
# **What *is* here is the scope, because only this file knows which suite the number is about.**
# A skip count is a fact about an environment *and* about a suite: CI's 48 is the count for this
# step, and `arch` runs 286 tests and skips none. The first attempt set `WEFT_EXPECTED_SKIPS`
# directly in the workflow's step env, which applies it to **every** task in the `ci-checks`
# sequence — `arch` claimed 48, produced 0, and the gate died before the tests ran. So the
# workflow supplies `WEFT_TEST_EXPECTED_SKIPS` — a value with the environment in it — and this
# task forwards it under the name `tests/conftest.py` reads, which puts the *suite* boundary in
# the file that defines the suite. Unset, it forwards an empty string and no claim is made.
[tool.poe.tasks.test.env]
WEFT_EXPECTED_SKIPS = "${WEFT_TEST_EXPECTED_SKIPS}"

[tool.poe.tasks.ci-no-tests]
sequence = ["fmt", "lint", "types", "arch"]
help = "Fast baseline: format, lint, types, architecture. No unit tests."

# Ledger task 6.23. The seven out-of-tree example packs ship 116 tests between them and
# `testpaths = ["tests"]` meant the gate had never run one — `docs/internal/lessons.md` L6.12: a directory
# of tests no task runs is prose, exactly as a documented check no task runs is prose, one level
# up from the check to the suite. Two of `weft-example-graph`'s were quietly red when somebody
# finally looked.
#
# **A task of its own rather than a widened `testpaths`, for two reasons.** An example pack is
# deliberately not a workspace member (fitness function 9(a)), so nothing installs it and its own
# `src/` has to reach `sys.path` explicitly — the same gap `[tool.pyright] extraPaths` already
# closes for type checking. And several packs name a test file the same thing (`test_store.py`,
# `test_retriever.py`), which pytest's default import mode refuses; `--import-mode=importlib`
# accepts it without renaming 28 files that belong to strangers.
[tool.poe.tasks.examples-tests]
help = "Task 6.23: the out-of-tree example packs' own suites, which the gate reaches."
cmd = "pytest examples -q --import-mode=importlib"

[tool.poe.tasks.examples-tests.env]
PYTHONPATH = "examples/weft-example-blob/src:examples/weft-example-describer/src:examples/weft-example-chunker/src:examples/weft-example-command/src:examples/weft-example-graph/src:examples/weft-example-ingest/src:examples/weft-example-llm/src:examples/weft-example-metric/src:examples/weft-example-query/src"

# **A fast signal, and never the gate.** `ci-checks` above is the canonical full gate and this is
# not a smaller version of it — it runs the tests a diff *can* have affected, which is a guess,
# and a guess is exactly what a gate may not be. `scripts/impacted_tests.py` carries the whole
# argument, including why `pytest-testmon` was not used.
#
# A `shell` task rather than a `cmd` one because the change set is computed by `git` and piped in:
# a script under `scripts/` is shipped-shaped code that `ruff`'s `S` rules apply to in full, so
# every `subprocess.run` in this tree carries a `# noqa: S603`, and a script that spawns nothing
# needs none.
[tool.poe.tasks.test-impacted]
help = "Only the tests a diff can have affected. A fast local/PR signal, never the gate."
shell = """
git rev-parse --verify --quiet "$base" > /dev/null 2>&1 || base=HEAD
against=$(git merge-base "$base" HEAD 2> /dev/null) || against="$base"
{ git diff --name-only "$against"; git ls-files --others --exclude-standard; } \
  | python scripts/impacted_tests.py $extra
"""

[[tool.poe.tasks.test-impacted.args]]
name = "base"
default = "origin/main"
help = "The ref to diff against. Falls back to HEAD when it does not resolve."

[[tool.poe.tasks.test-impacted.args]]
name = "extra"
default = ""
help = "Extra arguments forwarded to pytest, as one string."

[tool.poe.tasks.ci-checks]
sequence = ["cold-lint-cache", "fmt", "lint", "types", "arch", "test", "examples-tests"]
help = "The canonical full gate. Every architecture check must be reachable from here, and it starts from a cold lint cache — see cold-lint-cache."

[tool.poe.tasks.kernel-isolated]
help = "Fitness function 1, primary half: install weft-kernel alone and import it."
cmd = "python scripts/check_kernel_isolated.py"

[tool.poe.tasks.isolated-installs]
help = "Task 6.6: install every published distribution alone in a clean env and import it."
cmd = "python scripts/check_isolated_installs.py"

# Not in `ci-checks`: it asks the index what it holds, so it would go red after every release.
[tool.poe.tasks.release-preflight]
help = "09 §1.1: the four preconditions for a v* tag a machine can hold. Run before tagging."
cmd = "python scripts/release_preflight.py"

[tool.poe.tasks.licence-sync]
help = "Task 11.0: copy the root LICENSE and NOTICE into every publishing distribution."
cmd = "python scripts/sync_licence_files.py"

[tool.poe.tasks.sdists]
help = "Task 6.7: every sdist carries what the checkout has, and the suite passes from them."
cmd = "python scripts/check_sdists.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "testing/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "S", "PTH", "RET", "SIM", "TID"]
# **`S101` is not ignored tree-wide any more** — `docs/internal/lessons.md` `L8.37`. The reason written
# beside it was always "assert is the point in tests", and the setting applied everywhere, so an
# `assert` in shipped code passed lint under a justification about test files. It is scoped to the
# directories the reason names, below. An `assert` is stripped under `-O`, so in shipped code it is
# not a check — this project has already been bitten by one claiming more than it could know
# (`weft_cli.route_ask`'s, cited in `CLAUDE.md` and in `phase-step`).
ignore = []

# **`docs/internal/lessons.md` `L11.40` — every test helper in this repository was exempt from redefinition
# detection, and nothing said so.** `F811` is selected above and applies to `tests/`, which read as
# "a redefined name is caught here". It is not: ruff exempts any name matching `dummy-variable-rgx`,
# whose default is `^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$` — every leading-underscore name — and the
# convention in this tree is that a test module's helpers are all underscore-prefixed. So
# redefining `_fact_node` or `_ctx` in the same file was invisible, in the one directory where a
# silently shadowed helper does the most damage: a fixture the reader believes is in force and is
# not. Narrowed to `^_$`, which keeps the idiom the name is actually for — a throwaway loop or
# unpack variable spelled `_` — and nothing else.
dummy-variable-rgx = "^_$"

[tool.ruff.lint.per-file-ignores]
# **Assert is the point in a test** — it is the assertion mechanism, and a test never runs under
# `-O`. That sentence used to sit beside a tree-wide `ignore = ["S101"]`, so it justified a
# narrower thing than it permitted and an `assert` in shipped code passed lint under a reason about
# test files (`docs/internal/lessons.md` `L8.37`). Scoped here to the directories the reason names.
"tests/**/*.py" = ["S101"]
"testing/**/*.py" = ["S101"]
"examples/**/*.py" = ["S101"]

# `.claude/hooks/` is not project Python. These files are launched by the Claude Code harness
# as bare `python3`, which is 3.9 on the development machine — not the 3.12 the packages are
# built against and not the `.venv` interpreter. `target-version = "py312"` above is therefore
# wrong for this one directory, and not harmlessly so: before this entry existed, ruff's `UP017`
# *demanded* `datetime.UTC` in `.claude/hooks/subagent_findings.py`, which is 3.11+ and crashed
# the hook on import. A hook that fails to import is silently a hook that does not exist, so the
# gate was not merely blind to the defect — it required it (`docs/internal/lessons.md` L6.6).
# `UP` alone is suppressed: every other rule selected above is version-independent and these
# files are worth linting, which is why the directory is not excluded outright.
".claude/hooks/*" = ["UP"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# `examples` joined this list at task 2.11 (`docs/07-extension-cost.md` §9): the out-of-tree
# example packs FF9(c) requires are neither workspace members nor `uv.lock`-resolved, so
# they were previously untyped by this gate entirely — a real gap in existing tooling,
# closed here rather than left implicit.
include = ["packages", "testing", "tests", "scripts", "eval", "examples"]
# Every first-party `src/` layout resolves because `uv sync` installs it editable into
# `.venv` — an out-of-tree example pack is deliberately *not* a workspace member (fitness
# function 9(a)), so nothing installs it there, and a test importing its own pack by name
# from outside `src/` has nothing to resolve against without its own path listed here.
extraPaths = [
    "scripts",
    "eval",
    "examples/weft-example-blob/src",
    "examples/weft-example-describer/src",
    "examples/weft-example-chunker/src",
    "examples/weft-example-command/src",
    "examples/weft-example-ingest/src",
    "examples/weft-example-llm/src",
    "examples/weft-example-query/src",
    "examples/weft-example-metric/src",
    # weft-example-graph (task 5.4): the graph add-on docs/02-extension-model.md section 4
    # specifies, built by a pack author who never touched packages/ — same reason as every
    # entry above. Named `weft-example-*` like every other example pack, and deliberately not
    # `weft-kg`: that is the name the design documents use for this pack as a *hypothetical*,
    # quoted verbatim in several first-party docstrings, so a real pack taking it turns every
    # legitimate quotation into a fitness-function-9(b) violation (docs/internal/lessons.md L5.28).
    # That reserved name was `weft-graph` until 2026-09-09, when G18 changed it: `weft-graph`
    # is another project's on PyPI, and this repository's own hypothetical could not keep a
    # name a real install would collide with.
    "examples/weft-example-graph/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
# `scripts/` is not a distribution and must not become one — it holds hand-run operator tools, and
# `docs/09-release.md` §4's prerequisites are artefacts, not a subsystem. But a test that re-read
# the corpus manifest itself would be a second manifest reader, drifting from the one an operator
# actually runs. So the script is imported, not reimplemented, and this is the one line that makes
# that possible. Paired with `[tool.pyright] extraPaths` below, which resolves the same import.
pythonpath = ["scripts", "eval"]

# A hang must fail, not stall. The registration seam guards blocking calls by
# overriding socket and SSL operations, so a regression there does not raise —
# the test simply never returns, and a stalled gate reads as "CI is stuck"
# rather than "the seam is broken". Generous on purpose: this is a deadlock
# detector, not a performance budget, and Phase 0 step 8 brings a container.
timeout = 60
