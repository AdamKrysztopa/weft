# MuSiQue-Ans, dev split — Phase 44b task 44.40, the multi-hop set for experiment E2.
#
# MuSiQue: Multihop Questions via Single-hop Question Composition (Trivedi, Balasubramanian, Khot
# and Sabharwal, TACL 2022), https://github.com/StonyBrookNLP/musique, distributed under CC BY 4.0
# (https://creativecommons.org/licenses/by/4.0/). Files derived from it here are modified: each
# paragraph becomes one document and each item becomes a Weft question, by
# `scripts/musique_questions.py`.
#
# The authors publish only a Google Drive archive, which that host's robots.txt closes to scripted
# download (read 2026-09-28; the ledger's 44.40 line quotes it). The file below is an unofficial
# Hugging Face copy under the authors' own file name, chosen by the owner on 2026-09-28. Its sha256
# is the one that copy publishes, so it vouches for the copy and not for the authors' archive.

