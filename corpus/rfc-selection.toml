# The RFCs of Phase 39's corpus (ledger task 39.3), chosen in six families so one anchor recurs across
# several documents — a status code in the HTTP family's successive editions, a header in the specs
# that define, refine and cite it — which is what makes the owner's Q2 checkable: exact matching
# cannot win when the anchor names several documents and the question's intent picks one.
# `scripts/rfc_corpus.py download --numbers-file` reads `numbers`; the families are for the people
# writing questions and are read by nothing else.

