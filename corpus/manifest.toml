# The named corpus — prerequisite V1 (`docs/09-release.md` §4.3).
#
# **The bytes are not tracked here, and that is the artefact working as specified.** V1 accepts a
# corpus that is "either redistributable or fetched by a pinned, checksummed script". What is
# tracked is this manifest: every document named, with the sha256 that identifies it and the pin
# that reproduces it. `python scripts/fetch_corpus.py fetch` materialises it;
# `... verify` checks a local materialisation against these digests.
#
# **Three tiers, and the tier decides what may be done with a document.**
#
# - `fetch`     — retrieved from a pinned, versioned source. This tier alone satisfies V1.
# - `gate`      — tracked in this repository; needs no network. (None yet.)
# - `operator`  — published under publisher copyright. Named and checksummed so a local copy can
#                 be *verified*, never fetched, and outside V1's reproducibility clause. An
#                 absent operator document is reported, not a failure.
#
# **Pins are versions, not names.** `1304.7717` returns the latest arXiv version; `1304.7717v2`
# returns one. A Wikipedia title returns today's article; an `oldid` returns one revision. Every
# fetchable document below carries the versioned form, which is what makes "reproducible
# byte-for-byte" a property rather than a hope.
#
# **`render` names what turns a fetched revision into a document, and both ends are pinned.**
# `action=raw` serves *wikitext*; the corpus holds prose, because `{{Dopracować|źródła = 2025-11}}`
# in a document is `{{Dopracować|źródła = 2025-11}}` in every chunk drawn from it. So an entry with
# a `render` carries `source_sha256` (the revision that was fetched) as well as `sha256` (the
# document that was written), and `scripts/wikitext.py` is the only thing that turns one into the
# other. Pinning only the second is how these nine entries were once pinned to bytes made by hand:
# every digest verified locally and not one of them could be reproduced by anybody else.
#
# **`math_blocks_dropped` is checked, not annotated.** MediaWiki's own plaintext renderer flattens
# one formula into 350 characters at one glyph per line, so mathematics is dropped instead — and a
# `fetch` fails if the rendering drops a different number than the entry claims.
#
# **Formats are NOT declared here.** V1 requires the corpus to cover every format an installed
# extractor claims, and the authority on what is claimed is the registry. A list here would be a
# second copy of it, and `README.md` opens by describing what happens to the second copy.

# **The extraction step is pinned too, and this is the argument above one step further.** A
# retrieval judgement in `eval/questions/` is a *quote* — a literal span of the text an extractor
# produced from one of the documents below. Pinning the fetch and the render pins the bytes; the
# span lives one step past them, in whatever turned those bytes into text. "Pinning only the
# second is how these nine entries were once pinned to bytes made by hand" applies unchanged to
# the third.
#
# It is not hypothetical, and it was measured rather than argued: `weft-pdf` declares
# `pypdf>=6.16` with no ceiling, `uv.lock` resolves `6.16.1`, a fresh resolve takes `6.16.2`, and
# under `6.16.2` five quotes stop being literal spans of the documents they name — found at ledger
# task 6.7, the first time the suite ran from freshly-built sdists outside the lockfile. Nothing in
# CI resolves freshly, so nothing else would have seen it.
#
# **This pin is a record, not a ceiling.** `weft-pdf` still declares a range, because what version
# an operator's own deployment runs is theirs to decide (G9). What is pinned here is which
# extractor produced *these quotes*, so a mismatch is named out loud instead of arriving as five
# unexplained quote failures. Raise it and re-take every affected quote in the same commit, exactly
# as `tests/docs/test_question_set.py` already requires when the backend itself is swapped.
#
# A backend with no third-party library behind it — `text`, `weft-extract`'s own decoder — has
# nothing to pin and is named in that module's `_BACKENDS_WITH_NO_LIBRARY` instead.

[extraction.pdf-text]
library = "pypdf"
version = "6.16.1"

[corpus]
name = "mrmr-v1"
description = "Feature selection by minimum redundancy and maximum relevance: papers in English, with a Polish subset from Wikipedia on the adjacent statistics."
created = "2026-08-17"
