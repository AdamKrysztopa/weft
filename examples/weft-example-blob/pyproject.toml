[project]
name = "weft-example-blob"
version = "0.0.0"
description = "A stranger's blob store — lives outside the weft workspace, proving fitness function 9."
requires-python = ">=3.12"
# Both deps are published packages any third party would `pip install`; this
# distribution never sees the weft workspace's source tree, only the wheels
# those two ship. weft-rag is depended on for the one thing a third-party blob
# pack needs from it: the `BlobStore` Protocol weft_blob publishes, and the
# `Removed` model `SourceDeletable` answers in — the same relationship
# docs/07-extension-cost.md section 1 states for any pack that implements a
# contract it does not itself define.
#
# **Both carry `>=X,<MAJOR+1`, and that is the point of an exemplar** — weft's ledger task 6.26.
# G9 settled that a version requirement *is* the dependency specifier and bare names end.
# `tests/architecture/test_example_packs_are_exemplars.py` in the weft repository is what keeps
# these bounds from drifting back off.
dependencies = ["weft-kernel>=0.1.0,<1.0.0", "weft-rag>=2.2.0,<3.0.0"]

# The one entry point a pack declares (weft's docs/02-extension-model.md
# section 2). Nothing under weft's own packages/ or testing/ names this
# distribution, this module, or the plugin name below — fitness function
# 9(b), asserted from the weft repository's own tests/architecture/.
[project.entry-points."weft.packs"]
example-blob = "weft_example_blob:register"

# This pack's own dev tooling — the fourth canonical file's test runner. Not
# shared with weft's own dev group: a stranger's `uv run pytest` here must
# work from this pyproject alone, with nothing borrowed from the workspace
# it is not a member of.
[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
